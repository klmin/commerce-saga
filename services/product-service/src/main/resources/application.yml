server:
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: product-service
  # access token 검증 (ADR 0008). 조회는 공개, 관리자 API 만 토큰이 필요하다
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:8086}/oauth2/jwks
          issuer-uri: ${AUTH_ISSUER:http://localhost:5175}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/product_db}
    username: ${PRODUCT_DB_USERNAME:product_svc}
    password: ${PRODUCT_DB_PASSWORD:product_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  # 상품 이미지 업로드 (ADR 0021). 형식·2MB 상한은 서비스가 다시 본다. 본문이 크면 여기서 413
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

# 상품 이미지 저장소 RustFS (S3 API, ADR 0021). 계정 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
product:
  images:
    endpoint: ${PRODUCT_IMAGES_ENDPOINT:http://localhost:9100}
    region: ${PRODUCT_IMAGES_REGION:us-east-1}
    bucket: ${PRODUCT_IMAGES_BUCKET:product-images}
    access-key: ${PRODUCT_IMAGES_ACCESS_KEY:rustfs-local}
    secret-key: ${PRODUCT_IMAGES_SECRET_KEY:rustfs-local-secret}
    connect-timeout: 2s
    read-timeout: 5s
    # 시작할 때 시드 상품 이미지를 저장소에 넣는다 (없을 때만)
    seed: ${PRODUCT_IMAGES_SEED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # HTTP 지연 p95 를 대시보드에서 histogram_quantile 로 본다 (http_server_requests_seconds_bucket)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
  # 분산 트레이싱·로그 (ADR 0013). OTLP 로 Alloy 에 보내면 trace 는 Tempo, 로그는 Loki 로 간다
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGGING_ENDPOINT:http://localhost:4328/v1/logs}
  # 로그를 OTLP 로 보낼지 (k8s 처럼 수집기가 없는 곳에서는 끈다)
  logging:
    export:
      enabled: ${OTLP_LOGGING_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: false
