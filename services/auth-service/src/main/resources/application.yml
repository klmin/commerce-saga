server:
  port: ${SERVER_PORT:8086}
  # 앞단 프록시(Caddy·Envoy·Vite)가 넘긴 Host·X-Forwarded-* 로 로그인 화면 리다이렉트·쿠키 경로를 만든다.
  # 경로 방식(example.com/auth/...)에서는 X-Forwarded-Prefix: /auth 가 붙어 온다 (설계 문서 7-4).
  # 헤더를 그대로 믿으므로 앞단은 들어온 X-Forwarded-Prefix 를 지우고 자기 값을 붙인다 (7-3)
  # Boot 4 이름(옛 server.forward-headers-strategy). X-Forwarded-Prefix 는 use-prefix 를 켜야 읽는다(기본 꺼짐)
  request:
    header:
      forwarded:
        strategy: framework
        naming: x-forwarded
        use-prefix: true

spring:
  application:
    name: auth-service
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DB_USERNAME:auth_svc}
    password: ${AUTH_DB_PASSWORD:auth_svc}
  # 개발용 시드 사용자(db/dev-seed) 포함이 기본. 운영은 AUTH_FLYWAY_LOCATIONS=classpath:db/migration
  flyway:
    locations: ${AUTH_FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/dev-seed}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  # 로그인 실패 횟수 (ADR 0008), SSO 로그인 세션 (ADR 0017)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  # SSO 로그인 세션. 쿠키(AUTH_SESSION, HttpOnly, SameSite=Lax, Secure 는 auth.cookie.secure)는 AuthorizationServerConfig.
  # 유휴 만료 30분 (Keycloak 의 SSO Session Idle 기본값과 같다). 사용자·관리자 화면 사이 재로그인 없이 오가는 기간
  session:
    timeout: ${AUTH_SSO_SESSION_IDLE:30m}
    redis:
      # Gateway 의 BFF 세션(gateway:session)과 섞이지 않게
      namespace: auth:session
  # 가입 이벤트(auth.events) 발행만 한다. 구독하는 토픽은 없다 (outbox relay 가 보낸다)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all

# outbox relay (libs/outbox). 기본은 스케줄러 relay.
# Debezium 으로 발행할 때는 OUTBOX_RELAY_ENABLED=false 로 띄우고 커넥터를 등록한다 (scripts/register-connectors.sh)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay: 200ms
    batch-size: 100

auth:
  # OIDC 인가 서버(SAS) 공개 주소 = 토큰 iss, 브라우저가 가는 주소 (ADR 0017, 설계 문서 7-3). 끝에 / 를 붙이지 않는다.
  # 호스트 방식 https://auth.example.com, 경로 방식 https://example.com/auth.
  # 로컬 기본값은 인증 화면 SPA 개발 서버(5175). 그 서버가 SAS 경로를 auth-service(8086)로 넘긴다 (설계 문서 7-2)
  issuer: ${AUTH_ISSUER:http://localhost:5175}
  # 로그인·가입 뒤 저장된 인가 요청이 없을 때 갈 사용자 화면
  web-home: ${WEB_HOME:http://localhost:5173/}
  oauth:
    access-token-ttl: ${AUTH_ACCESS_TOKEN_TTL:15m}
    # 로그인부터 이만큼 (갱신해도 회전하지 않아 늘어나지 않는다, 후속 5-2)
    refresh-token-ttl: ${AUTH_OAUTH_REFRESH_TOKEN_TTL:14d}
    # 모든 토큰이 끝난 인가 기록을 이만큼 지난 뒤 지운다
    authorization-retention: ${AUTH_OAUTH_AUTHORIZATION_RETENTION:1d}
    cleanup:
      interval: ${AUTH_OAUTH_CLEANUP_INTERVAL:1h}
    # 시크릿을 외부에서 주지 않았을 때 쓰는 로컬 개발용 파일 디렉터리 (oauth-client-<id>.secret, Gateway 와 같은 파일).
    # compose·k8s 는 비운다 → 시크릿이 없으면 기동 실패 (설계 문서 6절)
    secret-dev-dir: ${OAUTH_CLIENT_SECRET_DEV_DIR:${user.home}/.commerce-saga}
    # 고정 등록하는 클라이언트 (DCR 아님). 시작할 때 DB 에 upsert 한다. 주소는 정확히 일치해야 한다(쉼표로 여럿)
    clients:
      gateway-web:
        secret: ${GATEWAY_WEB_CLIENT_SECRET:}
        redirect-uris: ${WEB_REDIRECT_URI:http://localhost:5173/login/oauth2/code/gateway-web}
        # 경로 방식은 관리자 화면도 이 클라이언트라 /admin/ 도 넣는다 (설계 문서 7-4)
        post-logout-redirect-uris: ${WEB_POST_LOGOUT_REDIRECT_URIS:http://localhost:5173/}
      gateway-admin:
        secret: ${GATEWAY_ADMIN_CLIENT_SECRET:}
        redirect-uris: ${ADMIN_REDIRECT_URI:http://localhost:5174/login/oauth2/code/gateway-admin}
        post-logout-redirect-uris: ${ADMIN_POST_LOGOUT_REDIRECT_URIS:http://localhost:5174/}
    # 시나리오 스크립트(scripts/lib/auth.sh)가 curl 로 사용자 토큰을 받는 공개 클라이언트 (PKCE, 루프백 redirect, 후속 5-3c).
    # 개발용 시드 사용자가 없는 운영(EKS)에서는 끈다
    scripts-client:
      enabled: ${AUTH_SCRIPTS_CLIENT_ENABLED:true}
      redirect-uri: http://127.0.0.1/scripts/callback
  # SAS 로그인 폼의 실패 제한 (아이디별, ADR 0008 의 규칙)
  policy:
    login-max-failures: ${AUTH_LOGIN_MAX_FAILURES:5}
    login-lock: ${AUTH_LOGIN_LOCK:15m}
  jwt:
    # 서명 키(PKCS#8 PEM)를 고르는 순서 (ADR 0008)
    # 1. 주입받은 키: private-key-location + key-id (k8s 는 Secret 을 파일로 마운트)
    # 2. 로컬 개발용 키 파일: 있으면 쓰고 없으면 만들어 저장한다. 재시작해도 이전 토큰이 검증된다
    # 3. 둘 다 비면 기동할 때마다 임시 키 (재시작하면 이전 토큰은 무효)
    key-id: ${AUTH_JWT_KEY_ID:}
    private-key-location: ${AUTH_JWT_PRIVATE_KEY_LOCATION:}
    dev-key-file: ${AUTH_JWT_DEV_KEY_FILE:${user.home}/.commerce-saga/auth-jwt-dev.pem}
  cookie:
    # 로컬 http 에서 확인할 때만 false
    secure: ${AUTH_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # 분산 트레이싱·로그 (ADR 0013). OTLP 로 Alloy 에 보내면 trace 는 Tempo, 로그는 Loki 로 간다
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGGING_ENDPOINT:http://localhost:4328/v1/logs}
  # 로그를 OTLP 로 보낼지 (k8s 처럼 수집기가 없는 곳에서는 끈다)
  logging:
    export:
      enabled: ${OTLP_LOGGING_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: false
