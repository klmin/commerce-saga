server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: point-service
  # access token 검증 (ADR 0008). 공개키는 auth-service JWKS, 서명·만료·issuer 를 보고 roles 클레임을 ROLE_* 권한으로
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
          issuer-uri: ${AUTH_JWT_ISSUER:commerce-saga-auth}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${POINT_DB_URL:jdbc:postgresql://localhost:5432/point_db}
    username: ${POINT_DB_USERNAME:point_svc}
    password: ${POINT_DB_PASSWORD:point_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  kafka:
    # 받은 메시지의 traceparent 헤더를 이어받아 처리 span 을 만든다 (ADR 0013).
    # 보내는 쪽(KafkaTemplate) observation 은 끈 채로 둔다. 켜면 outbox 에 저장한 traceparent 를 relay 문맥으로 덮어쓴다
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

# outbox relay (libs/outbox). 기본은 스케줄러 relay.
# Debezium 으로 발행할 때는 OUTBOX_RELAY_ENABLED=false 로 띄우고 커넥터를 등록한다 (scripts/register-connectors.sh)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay: 200ms
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # 분산 트레이싱 (ADR 0013). OTLP 로 Tempo 에 보낸다 (infra/docker-compose.yml, Grafana http://localhost:3030)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
  # 메트릭은 OTLP 로 밀지 않는다 (starter 가 가져오는 OTLP 메트릭 레지스트리 끄기)
  otlp:
    metrics:
      export:
        enabled: false

# 가입(auth.events UserRegistered) 하면 만드는 포인트 계정의 시작 잔액 (후속 2 A-3-2)
point:
  account:
    signup-bonus: ${POINT_SIGNUP_BONUS:1000}
