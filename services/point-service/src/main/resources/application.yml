server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: point-service
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${POINT_DB_URL:jdbc:postgresql://localhost:5432/point_db}
    username: ${POINT_DB_USERNAME:point_svc}
    password: ${POINT_DB_PASSWORD:point_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

# 스케줄러 outbox relay (libs/outbox)
outbox:
  relay:
    fixed-delay: 200ms
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info
