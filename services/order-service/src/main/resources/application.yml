server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  # access token 검증 (ADR 0008). 공개키는 auth-service JWKS, 서명·만료·issuer 를 보고 roles 클레임을 ROLE_* 권한으로
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:8086}/oauth2/jwks
          issuer-uri: ${AUTH_ISSUER:http://localhost:5175}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${ORDER_DB_URL:jdbc:postgresql://localhost:5432/order_db}
    username: ${ORDER_DB_USERNAME:order_svc}
    password: ${ORDER_DB_PASSWORD:order_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  kafka:
    # 받은 메시지의 traceparent 헤더를 이어받아 처리 span 을 만든다 (ADR 0013).
    # 보내는 쪽(KafkaTemplate) observation 은 끈 채로 둔다. 켜면 outbox 에 저장한 traceparent 를 relay 문맥으로 덮어쓴다
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

# outbox relay (libs/outbox). 기본은 스케줄러 relay.
# Debezium 으로 발행할 때는 OUTBOX_RELAY_ENABLED=false 로 띄우고 커넥터를 등록한다 (scripts/register-connectors.sh)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay: 200ms
    batch-size: 100

# 멈춘 Saga 정리 (ADR 0007). 단계마다 step-timeout 동안 응답이 없으면 같은 커맨드를 다시 보내고,
# 재고 예약·포인트 차감은 max-resends, 결제는 max-payment-resends 번 넘게 응답이 없으면 역순 보상한다
# (결제는 결제 취소부터, 늦은 승인은 결제 서비스가 환불). 보상 단계는 포기하지 않는다
# 주문 때 상품 가격 확인 (ADR 0016). Gateway 를 거치지 않는 클러스터 안 주소, 타임아웃이면 주문을 만들지 않고 503
order:
  product-catalog:
    base-url: ${PRODUCT_SERVICE_URL:http://localhost:8087}
    timeout: ${PRODUCT_CATALOG_TIMEOUT:2s}

saga:
  timeout:
    enabled: ${SAGA_TIMEOUT_ENABLED:true}
    step-timeout: ${SAGA_STEP_TIMEOUT:30s}
    max-resends: ${SAGA_MAX_RESENDS:3}
    max-payment-resends: ${SAGA_PAYMENT_MAX_RESENDS:10}
    scan-interval: ${SAGA_TIMEOUT_SCAN_INTERVAL:5s}
    batch-size: 100

# 멱등 기록 정리 (PROGRESS 4-4절 ②, ADR 0006). processed_message 보존은 Kafka 토픽 보존(7일) + DLT 재처리 기간보다 길게
idempotency:
  cleanup:
    enabled: ${IDEMPOTENCY_CLEANUP_ENABLED:true}
    interval: ${IDEMPOTENCY_CLEANUP_INTERVAL:1h}
    processed-message-retention: ${PROCESSED_MESSAGE_RETENTION:30d}
    # 지난 뒤 같은 키로 보내면 새 주문이 된다 (시나리오 10)
    idempotency-key-retention: ${IDEMPOTENCY_KEY_RETENTION:7d}
    batch-size: 1000
    max-batches-per-run: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # HTTP 지연 p95 를 대시보드에서 histogram_quantile 로 본다 (http_server_requests_seconds_bucket)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
  # 분산 트레이싱·로그 (ADR 0013). OTLP 로 Alloy 에 보내면 trace 는 Tempo, 로그는 Loki 로 간다 (infra/docker-compose.yml, Grafana http://localhost:3030)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGGING_ENDPOINT:http://localhost:4328/v1/logs}
  # 로그를 OTLP 로 보낼지 (k8s 처럼 수집기가 없는 곳에서는 끈다)
  logging:
    export:
      enabled: ${OTLP_LOGGING_EXPORT_ENABLED:true}
  # 메트릭은 OTLP 로 밀지 않는다 (starter 가 가져오는 OTLP 메트릭 레지스트리 끄기)
  otlp:
    metrics:
      export:
        enabled: false
