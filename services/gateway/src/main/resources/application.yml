server:
  port: ${SERVER_PORT:8000}

spring:
  application:
    name: gateway
  # rate limit 토큰 버킷 (auth-service 와 같은 Redis, 키 접두사가 달라 섞이지 않는다)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      # 명령 하나를 기다리는 최대 시간 (기본 60초). 세션·rate limit 은 요청마다 Redis 를 부르고 연결 하나를 같이 쓴다.
      # SPA 가 화면을 옮기며 진행 중인 요청을 끊을 때 그 연결이 한동안 응답을 못 받아 모든 요청이 기본값만큼 멈춘 적이 있다
      # (5-3a browser-e2e). 짧게 두면 그 요청만 실패하고 바로 풀린다. rate limit 은 Redis 오류면 통과시킨다
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  # BFF 세션 (ADR 0017). 쿠키 GW_SESSION 은 BffClientConfig. auth-service 의 SSO 세션(auth:session)과 접두어를 나눈다.
  # 유휴 2시간: 쇼핑 중 잠깐 자리를 비워도 이어지고, 공용 PC 에 오래 남지 않게. 끝나면 API 가 401 → 다시 로그인
  # (SSO 세션 30분이 남아 있으면 화면 없이 통과)
  session:
    timeout: ${GATEWAY_SESSION_IDLE:2h}
    redis:
      namespace: gateway:session
  # access token 1차 검증 (ADR 0008). 서비스도 같은 설정으로 다시 검증한다
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_INTERNAL_URL:http://localhost:8086}/oauth2/jwks
          issuer-uri: ${AUTH_ISSUER:http://localhost:5175}
  cloud:
    gateway:
      server:
        webflux:
          # 1~3단계의 사용자 헤더로 다른 사용자 행세를 못 하게 지운다 (서비스는 이제 JWT sub 만 본다)
          default-filters:
            - RemoveRequestHeader=X-User-Id
          # /api/<자원>/** → 서비스의 /<자원>/** (StripPrefix=1). Authorization 헤더는 그대로 넘겨 서비스가 다시 검증한다
          routes:
            - id: orders
              uri: ${ORDER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/orders,/api/orders/**,/api/cart,/api/cart/**
              filters: &user-api
                - StripPrefix=1
                # BFF 세션이면 세션의 access token 을 Authorization: Bearer 로 (만료면 refresh 로 갱신). Bearer 로 온 요청은 그대로
                - TokenRelay=
                # 브라우저 쿠키(GW_SESSION·XSRF-TOKEN)를 서비스로 넘기지 않는다. 서비스는 Bearer 로만 인증하고,
                # 쿠키가 실린 상태 변경 요청은 CSRF 로 거절한다(ADR 0008)
                - RemoveRequestHeader=Cookie
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: ${GATEWAY_USER_RATE:20}
                    redis-rate-limiter.burstCapacity: ${GATEWAY_USER_BURST:40}
            - id: stocks
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/stocks/**
              filters: *user-api
            # 상품 조회는 로그인 없이 (GatewaySecurityConfig). 쓰기는 아래 admin-products 로만 (ADR 0016)
            - id: products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/products,/api/products/**
                - Method=GET
              filters: *user-api
            # 상품 검색은 로그인 없이 (GatewaySecurityConfig). /api/search/** → search-service /search/** (ADR 0010)
            - id: search
              uri: ${SEARCH_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/search/**
                - Method=GET
              filters: *user-api
            - id: points
              uri: ${POINT_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/points/**
              filters: *user-api
            - id: payments
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/payments,/api/payments/**
              filters: *user-api
            - id: notifications
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/notifications/**
              filters: *user-api
            # 관리자: /api/admin/payment-faults → payment-service /admin/payment-faults (ADMIN 역할은 GatewaySecurityConfig)
            - id: admin-payment-faults
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/admin/payment-faults
              filters: *user-api
            # 관리자 상품 관리: /api/admin/products/** → product-service /admin/products/** (ADMIN 역할)
            - id: admin-products
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/admin/products,/api/admin/products/**
              filters: *user-api
            # 관리자 재고 조정: /api/admin/stocks/** → inventory-service /admin/stocks/** (ADMIN 역할, ADR 0019)
            - id: admin-stocks
              uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/admin/stocks/**
              filters: *user-api

# 이 주소에서 온 연결만 X-Forwarded-For 를 믿는다 (rate limit 의 IP, ADR 0011). 화면의 BFF(Next 서버) 주소·대역.
# 로컬은 Next 가 같은 PC 에서 돈다. 배포에서는 BFF 대역만 둔다. 비우면 아무도 믿지 않는다
gateway:
  trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:127.0.0.1,::1}
  # BFF: SAS 의 OAuth2 클라이언트 (ADR 0017, 설계 문서 6·7-3절). 주소는 모두 설정값이고 코드에 박지 않는다.
  # 전달 헤더(forwarded)를 처리하지 않는다: 켜면 X-Forwarded-For 맨 왼쪽(브라우저가 쓸 수 있는 값)이 연결 주소가 되어
  # rate limit IP(ClientIpResolver)가 무너진다. 그래서 redirect URI 는 요청 주소로 만들지 않고 아래 설정값을 쓴다
  bff:
    # 공개 주소 (브라우저가 가는 인가·로그아웃 주소, 토큰 iss). auth-service 의 auth.issuer 와 같다. 끝에 / 없이
    issuer: ${AUTH_ISSUER:http://localhost:5175}
    # 내부 주소 (Gateway 가 부르는 토큰 교환·JWKS)
    internal-url: ${AUTH_INTERNAL_URL:http://localhost:8086}
    # 이 Host(포트 포함)로 로그인을 시작하면 gateway-admin. 경로 방식은 비운다(늘 gateway-web)
    admin-client-host: ${ADMIN_CLIENT_HOST:localhost:5174}
    # 로그인 뒤 return_to 가 없을 때·로그아웃 뒤 갈 곳. 절대 주소 또는 경로(경로 방식: / 와 /admin/)
    web-home: ${WEB_HOME:http://localhost:5173/}
    admin-home: ${ADMIN_HOME:http://localhost:5174/}
    # 시크릿: 외부 변수 → 로컬 개발용 파일(auth-service 와 같은 파일) → 없으면 기동 실패. compose·k8s 는 디렉터리를 비운다
    secret-dev-dir: ${OAUTH_CLIENT_SECRET_DEV_DIR:${user.home}/.commerce-saga}
    # BFF 세션 쿠키 Secure. 로컬·compose(http)만 false
    cookie-secure: ${GATEWAY_COOKIE_SECURE:true}
    web:
      secret: ${GATEWAY_WEB_CLIENT_SECRET:}
      redirect-uri: ${WEB_REDIRECT_URI:http://localhost:5173/login/oauth2/code/gateway-web}
    admin:
      secret: ${GATEWAY_ADMIN_CLIENT_SECRET:}
      redirect-uri: ${ADMIN_REDIRECT_URI:http://localhost:5174/login/oauth2/code/gateway-admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # HTTP 지연 p95 를 대시보드에서 histogram_quantile 로 본다 (http_server_requests_seconds_bucket)
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 5ms
      maximum-expected-value:
        http.server.requests: 30s
  # 분산 트레이싱·로그 (ADR 0013). OTLP 로 Alloy 에 보내면 trace 는 Tempo, 로그는 Loki 로 간다
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
    logging:
      export:
        otlp:
          endpoint: ${OTLP_LOGGING_ENDPOINT:http://localhost:4328/v1/logs}
  # 로그를 OTLP 로 보낼지 (k8s 처럼 수집기가 없는 곳에서는 끈다)
  logging:
    export:
      enabled: ${OTLP_LOGGING_EXPORT_ENABLED:true}
  otlp:
    metrics:
      export:
        enabled: false
