server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: payment-service
  # access token 검증 (ADR 0008). 공개키는 auth-service JWKS, 서명·만료·issuer 를 보고 roles 클레임을 ROLE_* 권한으로
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
          issuer-uri: ${AUTH_JWT_ISSUER:commerce-saga-auth}
          authorities-claim-name: roles
          authority-prefix: ROLE_
  # 계정·비밀번호 기본값은 infra/docker-compose.yml 의 로컬 개발용 값
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_svc}
    password: ${PAYMENT_DB_PASSWORD:payment_svc}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  kafka:
    # 받은 메시지의 traceparent 헤더를 이어받아 처리 span 을 만든다 (ADR 0013).
    # 보내는 쪽(KafkaTemplate) observation 은 끈 채로 둔다. 켜면 outbox 에 저장한 traceparent 를 relay 문맥으로 덮어쓴다
    listener:
      observation-enabled: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest

# outbox relay (libs/outbox). 기본은 스케줄러 relay.
# Debezium 으로 발행할 때는 OUTBOX_RELAY_ENABLED=false 로 띄우고 커넥터를 등록한다 (scripts/register-connectors.sh)
outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay: 200ms
    batch-size: 100

# 가짜 PG 장애 주입 초기값 (실행 중에는 PUT /admin/payment-faults 로 바꾼다)
#   mode: APPROVE(승인) | DECLINE(거절) | DELAY(delay-millis 만큼 지연 후 승인)
#   client-timeout: 결제 서비스가 PG 응답을 기다리는 시간. 넘으면 결제를 UNKNOWN 으로 두고 PG 조회로 확정한다
#                   (PG 는 계속 처리해 늦게 승인할 수 있다, ADR 0007)
fake-pg:
  mode: ${FAKE_PG_MODE:APPROVE}
  delay-millis: ${FAKE_PG_DELAY_MILLIS:0}
  client-timeout: ${PG_CLIENT_TIMEOUT:3s}

# 결제 보정 (ADR 0007): UNKNOWN 결제를 PG 조회로 확정, 취소된 주문의 승인 결제를 PG 환불
#   not-found-after: PG 에 거래가 계속 없으면 이 시간 뒤 거절로 확정 (PG 최대 처리 시간보다 길게)
payment:
  reconcile:
    enabled: ${PAYMENT_RECONCILE_ENABLED:true}
    interval: ${PAYMENT_RECONCILE_INTERVAL:2s}
    not-found-after: ${PAYMENT_RECONCILE_NOT_FOUND_AFTER:2m}
    batch-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # 분산 트레이싱 (ADR 0013). OTLP 로 Tempo 에 보낸다 (infra/docker-compose.yml, Grafana http://localhost:3000)
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4328/v1/traces}
  # 메트릭은 OTLP 로 밀지 않는다 (starter 가 가져오는 OTLP 메트릭 레지스트리 끄기)
  otlp:
    metrics:
      export:
        enabled: false
