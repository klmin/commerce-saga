# 화면 SPA 정적 파일 (frontend/Dockerfile). 앞단(Caddy·Envoy)이 Gateway 경로(/api 등)를 먼저 나누고 나머지를 여기로 보낸다.
# 경로 방식이면 앞단이 앞 경로(/admin)를 떼고 보낸다: 여기서는 늘 루트 기준
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # 버전이 바뀌면 새 index.html 을 받게 (자산 이름이 바뀐다)
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # 빌드가 해시를 붙인 자산은 오래 둔다. 없는 자산은 index.html 이 아니라 404
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # 화면 경로(/orders/1 등)는 모두 index.html (SPA fallback). 라우터가 그린다
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
