name: k8s

# 후속 3: kind 클러스터에 Helm 차트(deploy/helm/commerce-saga)로 전체를 올리고 Saga 스모크를 돈다.
# 클러스터를 상시 띄우지 않고 PR 마다 여기서 검증한다 (브리프 5절). Kafka 는 Strimzi, Postgres·Redis 는 차트 안 StatefulSet·Deployment.
# relay 는 배포 기준인 Debezium(ADR 0004): Strimzi KafkaConnect + 서비스별 KafkaConnector (K-2)
on:
  push:
    branches: [main]
    paths: ['deploy/**', 'services/**', 'libs/**', 'build-logic/**', 'frontend/**', 'infra/postgres/**', 'infra/alloy/**', 'infra/tempo/**', 'infra/loki/**', 'infra/prometheus/**', 'infra/grafana/**', 'infra/alertmanager/**', 'scripts/k8s-*.sh', 'scripts/smoke-tracing.sh', '.github/workflows/k8s.yml']
  pull_request:
    paths: ['deploy/**', 'services/**', 'libs/**', 'build-logic/**', 'frontend/**', 'infra/postgres/**', 'infra/alloy/**', 'infra/tempo/**', 'infra/loki/**', 'infra/prometheus/**', 'infra/grafana/**', 'infra/alertmanager/**', 'scripts/k8s-*.sh', 'scripts/smoke-tracing.sh', '.github/workflows/k8s.yml']
  # argocd 잡은 PR 에서 배포 설정이 바뀔 때만 돈다 → main 에 들어간 결과는 매일 한 번 다시 본다
  schedule:
    - cron: '0 19 * * *' # 매일 04:00 KST
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# PR 은 새 push 가 오면 앞 실행을 취소한다. main(push·schedule 등)은 실행마다 그룹이 달라 취소되지 않는다
# (release 가 이 커밋의 main CI 결과를 기다린다. 같은 그룹이면 대기 중인 실행도 다음 실행에 밀려 취소된다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # PR 에서 배포 설정(차트·ArgoCD·배포 스크립트)이 바뀌었는지. 서비스 코드만 바뀐 PR 은 kind 잡이 같은 차트로 확인하므로
  # argocd 잡(GitOps 경로: ArgoCD 가 저장소에서 가져와 sync)은 건너뛴다. main push·매일·수동 실행에서는 항상 돈다
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy: ${{ steps.diff.outputs.deploy }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -z "$PR" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate --jq '.[].filename')
          # 파이프 + grep -q 는 일치하면 바로 끝나 앞쪽이 SIGPIPE 로 실패하고 pipefail 에 걸린다 → here-string
          if grep -qE '^(deploy/|scripts/k8s-|\.github/workflows/k8s\.yml$)' <<< "$files"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # 차트의 Postgres 초기화 SQL 은 infra/postgres/init 의 사본이다 (Helm 은 차트 밖 파일을 못 읽는다)
      - name: 초기화 SQL 사본 확인
        run: diff infra/postgres/init/01-create-service-databases.sql deploy/helm/commerce-saga/files/01-create-service-databases.sql

      # 관측성 설정(alloy·tempo·loki·경보 규칙·Alertmanager·Grafana)도 infra/ 의 사본이다. 로컬과 클러스터가 같은 설정을 쓴다
      - name: 관측성 설정 사본 확인
        run: |
          d=deploy/helm/commerce-saga/files/observability
          diff infra/alloy/config.alloy $d/config.alloy
          diff infra/tempo/tempo.yaml $d/tempo.yaml
          diff infra/loki/loki.yaml $d/loki.yaml
          diff infra/prometheus/prometheus.yml $d/prometheus.yml
          diff infra/prometheus/rules/commerce.yml $d/commerce.yml
          diff infra/alertmanager/alertmanager.yml $d/alertmanager.yml
          diff infra/alertmanager/entrypoint.sh $d/alertmanager-entrypoint.sh
          diff infra/grafana/provisioning/datasources/datasources.yaml $d/datasources.yaml
          diff infra/grafana/provisioning/dashboards/dashboards.yaml $d/dashboards.yaml
          diff infra/grafana/dashboards/commerce-saga.json $d/commerce-saga.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: 차트 lint
        run: helm lint deploy/helm/commerce-saga

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: commerce-saga

      # 스모크 시나리오 9i 가 429 를 볼 수 있게 사용자별 rate limit 을 낮춘다 (e2e 워크플로와 같은 값)
      - name: 배포 (이미지 빌드 → kind → Strimzi → 차트)
        run: |
          bash scripts/k8s-deploy.sh \
            --set services.gateway.env.GATEWAY_USER_RATE=5 \
            --set services.gateway.env.GATEWAY_USER_BURST=10

      - name: port-forward
        run: bash scripts/k8s-port-forward.sh

      - name: 주문 Saga·보상 (시나리오 0·1)
        run: bash scripts/smoke-saga.sh

      - name: Gateway·소유권 (시나리오 9)
        run: bash scripts/smoke-gateway.sh

      - name: 주문 Idempotency-Key (시나리오 10)
        run: bash scripts/smoke-idempotency.sh

      # 스케줄러가 아니라 Debezium 이 발행했다는 증거 (e2e 워크플로의 debezium 모드 확인과 같음):
      # 커넥터 6개(outbox 5 + 상품 테이블 CDC 1) Ready, outbox 는 넣고 바로 지워져 비어 있고, slot 이 살아 있다
      - name: Debezium relay 확인 (커넥터 Ready, outbox 비어 있음, slot)
        run: |
          kubectl -n commerce get kafkaconnector
          kubectl -n commerce wait kafkaconnector --all --for=condition=Ready --timeout=1m
          for s in order inventory point payment auth; do
            n=$(kubectl -n commerce exec statefulset/postgres -- psql -U postgres -d ${s}_db -tAc "select count(*) from outbox")
            echo "${s}_db outbox rows=$n"
            [ "$n" = "0" ] || { echo "${s}_db outbox 에 행이 남음"; exit 1; }
          done
          kubectl -n commerce exec statefulset/postgres -- psql -U postgres -tAc "select slot_name, database, active from pg_replication_slots"
          active=$(kubectl -n commerce exec statefulset/postgres -- psql -U postgres -tAc "select count(*) from pg_replication_slots where active")
          [ "$active" = "6" ] || { echo "활성 slot 이 $active 개 (기대 6)"; exit 1; }

      - name: 상품 테이블 CDC (시나리오 16)
        env:
          KAFKA_EXEC: kubectl -n commerce exec -i commerce-dual-role-0 --
          KAFKA_BOOTSTRAP: localhost:9092
        run: bash scripts/smoke-product-cdc.sh

      # ES 중단(17e)은 compose(e2e)에서만
      - name: 상품 검색 (시나리오 17)
        env:
          KAFKA_EXEC: kubectl -n commerce exec -i commerce-dual-role-0 --
          KAFKA_BOOTSTRAP: localhost:9092
          SKIP_OUTAGE: "true"
        run: bash scripts/smoke-search.sh

      - name: 화면이 Gateway 를 거쳐 뜨는지
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3500/login)
          [ "$code" = 200 ] || { echo "frontend /login → $code"; exit 1; }

      # 클러스터 안 관측성: 서비스 → alloy → tempo·loki (port-forward 로 compose 와 같은 포트)
      - name: 분산 트레이싱·로그 (시나리오 11)
        run: bash scripts/smoke-tracing.sh

      # alloy 가 서비스 9개와 kafka-exporter 를 긁어 Prometheus 로 보내고 있는지 (경보 규칙이 이 job 들을 본다)
      - name: 메트릭 대상
        run: |
          up_count() { curl -sf -G http://localhost:9091/api/v1/query --data-urlencode "query=$1" | grep -oE '"value":\[[^]]*"1"\]' | wc -l; }
          for i in $(seq 1 30); do
            s=$(up_count 'up{job="services"}'); k=$(up_count 'up{job="kafka"}')
            [ "$s" = 9 ] && [ "$k" = 1 ] && break
            sleep 2
          done
          echo "services up=$s/9, kafka-exporter up=$k/1"
          [ "$s" = 9 ] && [ "$k" = 1 ]
          rules=$(curl -sf http://localhost:9091/api/v1/rules | grep -o '"type":"alerting"' | wc -l)
          echo "경보 규칙 $rules 개"
          [ "$rules" -gt 0 ]

      - name: 상태·로그
        if: always()
        run: |
          kubectl -n commerce get pods,kafka,kafkatopic,kafkaconnect,kafkaconnector -o wide || true
          # Strimzi 는 Deployment 대신 StrimziPodSet 으로 Pod 를 띄운다
          kubectl -n commerce logs -l strimzi.io/kind=KafkaConnect --tail=80 || true
          kubectl -n commerce get events --sort-by=.lastTimestamp | tail -40 || true
          for d in auth-service product-service search-service order-service inventory-service point-service payment-service notification-service gateway frontend; do
            echo "===== $d"
            kubectl -n commerce logs deployment/$d --tail=80 || true
          done
          for d in alloy loki tempo prometheus; do
            echo "===== $d"
            kubectl -n commerce logs deployment/$d --tail=30 || true
          done

  # 후속 3 K-3: 같은 구성을 ArgoCD(GitOps)로. root Application 하나만 apply 하면 ArgoCD 가 이 PR 의 커밋을 GitHub 에서 가져와
  # Strimzi·Envoy Gateway·commerce-saga 를 sync 한다. 외부 입구는 edge(Gateway API) 하나이고 화면만 연다
  argocd:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: app-of-apps 차트 lint
        run: |
          helm lint deploy/argocd/apps
          # EKS 값(K-4)도 렌더링되는지
          helm lint deploy/argocd/apps -f deploy/argocd/apps/values-eks.yaml
          # EKS release 커밋처럼 apps 차트에 release-tags.yaml(이미지별 태그)이 있으면 앱 차트 값으로 넘어가고, 그 이미지만 태그가 바뀌는지
          printf 'commerceValues:\n  image:\n    tags:\n      order-service: per-image-tag\n' > deploy/argocd/apps/release-tags.yaml
          helm lint deploy/argocd/apps -f deploy/argocd/apps/values-eks.yaml
          helm template root deploy/argocd/apps -f deploy/argocd/apps/values-eks.yaml | grep -q 'order-service: per-image-tag'
          rm deploy/argocd/apps/release-tags.yaml
          out=$(helm template commerce deploy/helm/commerce-saga --set image.tag=common --set image.tags.order-service=per-image-tag)
          echo "$out" | grep -q 'image: commerce-saga/order-service:per-image-tag'
          echo "$out" | grep -q 'image: commerce-saga/inventory-service:common'

      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: commerce-saga

      # ArgoCD 는 GitHub 에서 가져온다. PR 이면 PR 의 head 커밋(같은 저장소 브랜치라 공개 저장소에 있다)
      # ArgoCD Notifications(deploy/argocd/notifications.yaml)를 EKS 와 같은 설정으로 켜고, Discord 대신 클러스터 안 수신 Pod 로 보낸다.
      # 수신 Pod 는 받은 본문을 JSON 으로 파싱해 한 줄로 찍는다(파싱 실패면 INVALID) → 아래 "알림 확인" 이 로그를 본다
      - name: 알림 수신 Pod
        run: |
          set -euo pipefail
          kubectl create namespace argocd
          kubectl -n argocd create secret generic argocd-notifications-secret \
            --from-literal=discord-webhook-url=http://notify-sink.argocd.svc:8080/webhook
          kubectl -n argocd create configmap notify-sink --from-literal=sink.py='
          import http.server, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  body = self.rfile.read(int(self.headers.get("Content-Length", 0))).decode()
                  try:
                      print("RECEIVED " + json.dumps(json.loads(body), ensure_ascii=False), flush=True)
                  except ValueError:
                      print("INVALID " + body.replace("\n", " "), flush=True)
                  self.send_response(204)
                  self.end_headers()
          http.server.HTTPServer(("", 8080), H).serve_forever()
          '
          kubectl -n argocd create deployment notify-sink --image=python:3.13-alpine --port=8080 \
            -- python -u /sink/sink.py
          kubectl -n argocd patch deployment notify-sink --type=json -p='[
            {"op":"add","path":"/spec/template/spec/volumes","value":[{"name":"sink","configMap":{"name":"notify-sink"}}]},
            {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts","value":[{"name":"sink","mountPath":"/sink"}]}]'
          kubectl -n argocd expose deployment notify-sink --port=8080
          kubectl -n argocd rollout status deployment/notify-sink --timeout=3m

      - name: ArgoCD 로 배포 (이미지 → kind, root Application → sync)
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          ARGOCD_NOTIFY: 'true'
        run: bash scripts/k8s-argocd.sh

      # commerce-saga 가 Synced·Healthy 가 되면 on-deployed 가 한 번 온다. 본문이 JSON 으로 파싱되고 제목·revision 이 맞는지
      - name: 알림 확인 (ArgoCD → 수신 Pod)
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            logs=$(kubectl -n argocd logs deployment/notify-sink)
            grep -q '^RECEIVED .*ArgoCD 배포 완료: commerce-saga' <<< "$logs" && break
            sleep 3
          done
          echo "$logs"
          line=$(grep '^RECEIVED .*ArgoCD 배포 완료: commerce-saga' <<< "$logs" | head -1)
          [ -n "$line" ] || { echo "배포 완료 알림이 오지 않음"; kubectl -n argocd logs deployment/argocd-notifications-controller --tail=50 || true; exit 1; }
          ! grep -q '^INVALID' <<< "$logs" || { echo "JSON 이 아닌 본문이 왔다"; exit 1; }
          grep -q "${REVISION:0:7}" <<< "$line" || { echo "알림의 revision 이 $REVISION 이 아님"; exit 1; }

      # edge 로 화면이 열리는지. Envoy 의 Service 를 로컬로 연결한다 (kind 에는 LoadBalancer 가 없다)
      - name: edge 로 화면
        run: |
          svc=$(kubectl -n envoy-gateway-system get svc -l gateway.envoyproxy.io/owning-gateway-name=commerce-edge -o name | head -1)
          [ -n "$svc" ] || { echo "edge Service 없음"; exit 1; }
          kubectl -n envoy-gateway-system port-forward "$svc" 18080:80 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:18080/login && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:18080/login)
          [ "$code" = 200 ] || { echo "edge /login → $code"; exit 1; }
          # Spring Gateway(/api, /auth)는 edge 로 나가지 않는다: Next 의 화면 경로로만 처리된다
          curl -s -o /dev/null -w 'edge /api/orders → %{http_code}\n' http://localhost:18080/api/orders

      - name: port-forward
        run: bash scripts/k8s-port-forward.sh

      - name: 주문 Saga·보상 (시나리오 0·1)
        run: bash scripts/smoke-saga.sh

      - name: 상태·로그
        if: always()
        run: |
          # ArgoCD 설치(helm --wait)에서 멈추면 commerce 에는 아무것도 없다 → argocd 네임스페이스부터
          kubectl -n argocd get pods -o wide || true
          kubectl -n argocd describe pods -l app.kubernetes.io/name=argocd-redis || true
          kubectl -n argocd get events --sort-by=.lastTimestamp | tail -40 || true
          kubectl -n argocd get applications -o wide || true
          kubectl -n argocd get application commerce-saga -o jsonpath='{.status.conditions}{"\n"}{.status.operationState.message}{"\n"}' || true
          kubectl -n commerce get pods,kafka,kafkaconnector,gateway,httproute -o wide || true
          kubectl -n commerce get events --sort-by=.lastTimestamp | tail -30 || true
