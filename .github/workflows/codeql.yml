name: codeql

# docs·md 만 바뀐 커밋은 건너뛴다. 분석 대상(java-kotlin, javascript-typescript, actions)이 그대로라 결과가 같다.
# 분석기 규칙 갱신은 주간 schedule 이 잡는다. 이 체크를 ruleset 필수 체크로 두면
# 건너뛴 PR 이 대기 상태로 남으니, 그때는 job 안에서 경로를 보고 skip 하는 방식으로 바꾼다
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  schedule:
    - cron: '0 18 * * 0' # 매주 월요일 03:00 KST

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none
          # frontend. 화면 SPA (토큰은 모르고 Gateway BFF 세션 쿠키로 /api 를 부른다, ADR 0017)
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
