name: frontend

# 화면. 두 갈래 (ADR 0017):
# - web: 새 화면 SPA workspace(frontend/apps/*, packages/*, pnpm). 형식·lint·타입·단위 테스트·빌드
# - next: 5-5 까지 남기는 Next 화면(frontend/next, npm, ADR 0011). lint·형식·타입·단위 테스트·빌드·Docker 이미지
# 백엔드 전체를 띄우는 브라우저 e2e(Playwright)는 browser-e2e 워크플로
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

# PR 은 새 push 가 오면 앞 실행을 취소한다. main(push·schedule 등)은 실행마다 그룹이 달라 취소되지 않는다
# (release 가 이 커밋의 main CI 결과를 기다린다. 같은 그룹이면 대기 중인 실행도 다음 실행에 밀려 취소된다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # 버전은 frontend/package.json 의 packageManager 와 같게
      - run: npm install -g pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  next:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/next
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/next/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Docker 이미지 빌드 확인
        run: docker build -t frontend .
