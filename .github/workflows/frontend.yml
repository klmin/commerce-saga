name: frontend

# 화면 SPA workspace (frontend/apps/*, packages/*, pnpm, ADR 0017). 형식·lint·타입·단위 테스트·빌드·이미지(nginx) 빌드 확인
# 백엔드 전체를 띄우는 브라우저 e2e(Playwright)는 browser-e2e 워크플로
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

# PR 은 새 push 가 오면 앞 실행을 취소한다. main(push·schedule 등)은 실행마다 그룹이 달라 취소되지 않는다
# (release 가 이 커밋의 main CI 결과를 기다린다. 같은 그룹이면 대기 중인 실행도 다음 실행에 밀려 취소된다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      # 버전은 frontend/package.json 의 packageManager 와 같게
      - run: npm install -g pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: 이미지 빌드 확인 (web·admin·auth, 경로 방식 BASE_PATH)
        run: |
          for app in web admin auth; do docker build -q --build-arg APP=$app -t commerce-saga/$app:ci . > /dev/null; done
          docker run -d --name admin-ci -p 18080:8080 -e BASE_PATH=/admin/ commerce-saga/admin:ci > /dev/null
          for i in $(seq 1 20); do curl -sf -o /dev/null http://localhost:18080/healthz && break; sleep 1; done
          curl -sf http://localhost:18080/products/1 | grep -q '<base href="/admin/" />'
          # 끝 / 가 없는 BASE_PATH 면 기동하지 않는다 (뜨면 timeout 이 끊어 실패)
          ! timeout 20 docker run --rm -e BASE_PATH=/admin commerce-saga/admin:ci > /dev/null 2>&1
