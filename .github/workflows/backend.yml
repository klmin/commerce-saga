name: backend

# 바뀐 서비스·도구만 빌드한다. libs/, build-logic/, Gradle 설정이 바뀌면 전체를 빌드한다.
on:
  push:
    branches: [main]
    paths:
      - 'services/**'
      - 'libs/**'
      - 'tools/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'services/**'
      - 'libs/**'
      - 'tools/**'
      - 'build-logic/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradlew'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: 빌드 대상 계산
        id: targets
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 첫 push 등으로 비교 기준이 없으면 전체 빌드
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "tasks=build" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qE '^(libs/|build-logic/|gradle/|[^/]+\.gradle\.kts$|gradlew$|\.github/workflows/backend\.yml$)'; then
            echo "tasks=build" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tasks=""
          for svc in $(echo "$changed" | sed -nE 's#^services/([^/]+)/.*#\1#p' | sort -u); do
            if [ -f "services/$svc/build.gradle.kts" ]; then
              tasks="$tasks :services:$svc:build"
            fi
          done
          for tool in $(echo "$changed" | sed -nE 's#^tools/([^/]+)/.*#\1#p' | sort -u); do
            if [ -f "tools/$tool/build.gradle.kts" ]; then
              tasks="$tasks :tools:$tool:build"
            fi
          done
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      # Testcontainers 테스트 포함 (ubuntu 러너에는 Docker가 있음)
      - name: Build and test
        if: steps.targets.outputs.tasks != ''
        run: ./gradlew ${{ steps.targets.outputs.tasks }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests'
