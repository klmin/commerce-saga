name: e2e

# 인프라(docker-compose) + 서비스(inventory, point, payment, order, notification, auth, gateway)를 실제로 띄우고 Saga 스모크 테스트를 돌린다.
# outbox relay 두 모드(scheduler: libs/outbox 스케줄러, debezium: Kafka Connect + Outbox Event Router)에서 같은 시나리오를 돌린다
on:
  push:
    branches: [main]
    paths: ['services/**', 'libs/**', 'tools/**', 'build-logic/**', 'infra/**', 'scripts/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['services/**', 'libs/**', 'tools/**', 'build-logic/**', 'infra/**', 'scripts/**', '.github/workflows/e2e.yml']

permissions:
  contents: read

# PR 은 새 push 가 오면 앞 실행을 취소한다. main(push·schedule 등)은 실행마다 그룹이 달라 취소되지 않는다
# (release 가 이 커밋의 main CI 결과를 기다린다. 같은 그룹이면 대기 중인 실행도 다음 실행에 밀려 취소된다)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  saga:
    name: saga (${{ matrix.relay }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        relay: [scheduler, debezium]
    env:
      # 서비스 application.yml 의 outbox.relay.enabled. debezium 모드는 스케줄러를 끄고 outbox 를 넣고 바로 지운다
      OUTBOX_RELAY_ENABLED: ${{ matrix.relay == 'scheduler' }}
      # order-service 단계 타임아웃(ADR 0007)을 짧게 둔다. 시나리오 2·4 가 재전송·포기·보상까지 몇십 초 안에 보이도록.
      # 다른 시나리오의 정상 흐름은 1~2초 안에 끝나고, 시나리오 5(커넥터 중단 약 20초)는 포기(약 40초) 전에 재개한다
      SAGA_STEP_TIMEOUT: 10s
      SAGA_MAX_RESENDS: 3
      SAGA_PAYMENT_MAX_RESENDS: 2
      # 결제 서킷 브레이커가 열린 뒤 시험 호출까지 기다림 (시나리오 15, 기본 30s)
      PAYMENT_CB_OPEN_WAIT: 5s
      # payment-service 결제 보정(PG 조회·환불) 주기. 시나리오 2 가 빨리 끝나도록
      PAYMENT_RECONCILE_INTERVAL: 1s
      SAGA_TIMEOUT_SCAN_INTERVAL: 1s
      # auth-service 동시 refresh 유예(ADR 0008). 시나리오 9 가 재사용 탐지까지 몇 초 안에 보이도록 (기본 20s)
      AUTH_REFRESH_GRACE: 2s
      # Gateway 사용자별 rate limit 을 낮춰 시나리오 9 가 429 를 볼 수 있게 (기본 초당 20, 버스트 40)
      GATEWAY_USER_RATE: 5
      GATEWAY_USER_BURST: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: bootJar
        run: ./gradlew :services:order-service:bootJar :services:inventory-service:bootJar :services:point-service:bootJar :services:payment-service:bootJar :services:notification-service:bootJar :services:auth-service:bootJar :services:product-service:bootJar :services:search-service:bootJar :services:gateway:bootJar

      # README 의 기동 명령 그대로. postgres-init(서비스 DB·계정), kafka-init(토픽)까지 끝나야 성공한다
      - name: 인프라 기동
        run: |
          docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180
          # Tempo·Loki·Alloy 이미지에는 healthcheck 를 둘 도구가 없어 여기서 준비를 기다린다 (시나리오 11)
          for url in http://localhost:3210/ready http://localhost:3110/ready http://localhost:12346/-/ready; do
            for i in $(seq 1 60); do curl -sf $url > /dev/null && break; sleep 2; done
            curl -sf $url > /dev/null || { echo "준비 안 됨: $url"; exit 1; }
          done

      - name: 서비스 기동
        run: |
          mkdir -p logs
          for svc in auth-service product-service search-service inventory-service point-service payment-service order-service gateway; do
            nohup java -jar services/$svc/build/libs/$svc-*.jar > logs/$svc.log 2>&1 &
          done
          for port in 8086 8087 8089 8081 8082 8083 8084 8000; do
            url=http://localhost:$port/actuator/health
            for i in $(seq 1 60); do
              curl -sf "$url" | grep -q UP && break
              sleep 2
            done
            curl -sf "$url" | grep -q UP || { echo "$url not UP"; exit 1; }
          done

      # Flyway 가 outbox 테이블을 만든 뒤(서비스 기동 후) 등록한다. 서비스는 위 env 로 스케줄러 relay 가 꺼져 있다
      - name: Debezium 커넥터 등록
        if: matrix.relay == 'debezium'
        run: bash scripts/register-connectors.sh

      # 검색용 products 테이블 CDC(ADR 0010)는 relay 모드와 상관없이 필요하다 (debezium 모드는 위에서 같이 등록)
      - name: 상품 테이블 CDC 커넥터 등록
        if: matrix.relay == 'scheduler'
        run: CONNECTORS=product-cdc bash scripts/register-connectors.sh

      # 가입·로그인·refresh 회전·재사용 탐지·로그아웃·로그인 잠금
      - name: 인증, refresh token 재사용 탐지 (시나리오 9)
        run: GRACE_WAIT=3 bash scripts/smoke-auth.sh

      # notification-service 는 일부러 띄우지 않는다 (알림 장애 중에도 주문이 완료되는지)
      - name: 스모크 테스트
        run: bash scripts/smoke-saga.sh

      # JWT 로 바꾼 뒤의 소유권 검사(IDOR), Gateway·서비스 각각의 토큰 검증, 관리자 역할, 사용자별 rate limit
      - name: Gateway·소유권 검사 (시나리오 9)
        run: bash scripts/smoke-gateway.sh

      # 같은 키 재요청·동시 요청에도 주문 하나, 같은 키 + 다른 본문은 422, 내 주문·결제 목록
      - name: 주문 Idempotency-Key·내 주문·결제 목록 (시나리오 10)
        run: bash scripts/smoke-idempotency.sh

      # 관리자가 가격 변경 → 옛 가격 주문 409 + 지금 가격 → 같은 키로 새 가격 주문(스냅샷) → 판매 중지 422 (ADR 0016)
      - name: 주문 가격 확인·가격 변경 이력 (시나리오 14)
        run: bash scripts/smoke-price-change.sh

      # products 변경 → product.cdc.products (키 = 상품 id, 변경 후 행, 헤더 __lsn) (ADR 0010)
      - name: 상품 테이블 CDC (시나리오 16)
        run: bash scripts/smoke-product-cdc.sh

      # CDC → search-service → Elasticsearch: 가격 변경·판매 중지 반영, 옛 변경 무시, ES 중단 중 검색만 503 → 재개 후 따라잡음 (ADR 0010)
      - name: 상품 검색 (시나리오 17)
        run: bash scripts/smoke-search.sh

      # 가입 → auth.events(UserRegistered, outbox) → point-service 가 계정 생성(가입 축하 포인트) → 그 포인트로 주문
      - name: 가입 → 포인트 계정 (시나리오 13)
        run: bash scripts/smoke-signup-points.sh

      - name: 알림 서비스 기동 후 밀린 이벤트 처리 확인 (시나리오 8)
        run: |
          nohup java -jar services/notification-service/build/libs/notification-service-*.jar > logs/notification-service.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8085/actuator/health | grep -q UP && break
            sleep 2
          done
          bash scripts/smoke-notification-catchup.sh

      # 서비스를 내리고 각 컨슈머 그룹 오프셋을 처음으로 되감은 뒤 다시 띄워, 이미 처리한 메시지를 전부 다시 받게 한다
      - name: 오프셋 되감기 후 중복 반영 없음 확인 (시나리오 3)
        run: |
          bash scripts/smoke-redelivery.sh snapshot
          services="inventory-service point-service payment-service order-service"
          for svc in $services; do pkill -f "$svc-.*\.jar" || true; done
          for svc in $services; do
            for i in $(seq 1 30); do pgrep -f "$svc-.*\.jar" > /dev/null || break; sleep 1; done
          done
          bash scripts/rewind-offsets.sh inventory-service inventory.command,order.events
          bash scripts/rewind-offsets.sh point-service point.command,auth.events
          bash scripts/rewind-offsets.sh payment-service payment.command
          bash scripts/rewind-offsets.sh order-service inventory.reply,point.reply,payment.reply
          for svc in $services; do
            nohup java -jar services/$svc/build/libs/$svc-*.jar >> logs/$svc.log 2>&1 &
          done
          for port in 8081 8082 8083 8084; do
            for i in $(seq 1 60); do
              curl -sf http://localhost:$port/actuator/health | grep -q UP && break
              sleep 2
            done
          done
          LOG_DIR=logs bash scripts/smoke-redelivery.sh verify

      - name: poison message 격리 후 DLT 재처리 (시나리오 6)
        run: bash scripts/smoke-poison.sh

      # point-service 를 내렸다 올린다. 짧은 장애는 재전송 후 이어서 완료, 긴 장애는 재전송 포기 후 역순 보상
      - name: 참여 서비스 다운 후 복구·보상 (시나리오 4)
        run: LOG_DIR=logs bash scripts/smoke-service-down.sh

      # PG 지연을 주입한다. 짧은 지연은 PG 조회로 승인 확정 후 완료, 긴 지연은 결제 취소·보상 후 늦은 승인 자동 환불
      - name: 결제 타임아웃 보정·늦은 승인 자동 환불 (시나리오 2)
        run: bash scripts/smoke-payment-timeout.sh

      # 주문 한 건(정상, 결제 실패 보상)이 다섯 서비스를 거치는 동안 trace 하나로 이어지는지, 주문 id 로 찾히는지
      - name: 분산 트레이싱, Saga 한 건 = trace 하나 (시나리오 11)
        run: bash scripts/smoke-tracing.sh

      # 장애를 넣고 경보가 실제로 firing 되는지 (Prometheus 가 호스트의 서비스와 kafka-exporter 를 긁는다)
      - name: 메트릭·경보, 장애 → 경보 firing (시나리오 12)
        run: bash scripts/smoke-alerts.sh

      # 커넥터를 멈춘 동안 낸 주문이 재개 후 모두 완료되는지(유실 0), 그동안 slot 이 WAL 을 붙잡는지, heartbeat 로 다시 줄어드는지
      - name: 커넥터 중단 후 재개, 유실 0 (시나리오 5)
        if: matrix.relay == 'debezium'
        run: bash scripts/smoke-connector-outage.sh

      # 검증이 아니라 측정. 두 모드의 결과를 로그로 남겨 ADR 0004 근거로 쓴다
      - name: relay 지연·DB 부하 측정 (시나리오 7)
        run: bash scripts/measure-relay.sh

      # PG 지연이 이어지면 서킷 브레이커가 열려 결제를 바로 실패시키고(즉시 보상), 복구 후 시험 호출로 다시 닫히는지.
      # 회로를 여는 동안 UNKNOWN 결제가 생기므로 다른 시나리오 뒤에 돈다
      - name: 결제 서킷 브레이커 (시나리오 15)
        run: bash scripts/smoke-pg-circuit.sh

      # 스케줄러가 아니라 Debezium 이 발행했다는 증거: outbox 는 넣고 바로 지워져 비어 있고(스케줄러가 읽을 행이 없음),
      # 커넥터는 계속 RUNNING, 서비스 DB 마다 replication slot 이 살아 있다
      - name: Debezium 모드 확인 (outbox 비어 있음, 커넥터 RUNNING)
        if: matrix.relay == 'debezium'
        run: |
          bash scripts/register-connectors.sh status
          bash scripts/register-connectors.sh status | grep -v "RUNNING RUNNING" && { echo "커넥터가 RUNNING 이 아님"; exit 1; }
          for s in order inventory point payment auth; do
            n=$(docker compose -f infra/docker-compose.yml exec -T -e PGPASSWORD=postgres postgres psql -U postgres -d ${s}_db -tAc "select count(*) from outbox")
            echo "${s}_db outbox rows=$n"
            [ "$n" = "0" ] || { echo "${s}_db outbox 에 행이 남음"; exit 1; }
          done
          docker compose -f infra/docker-compose.yml exec -T -e PGPASSWORD=postgres postgres psql -U postgres -tAc "select slot_name, database, active from pg_replication_slots"

      - name: Logs
        if: always()
        run: |
          for svc in inventory-service point-service payment-service order-service notification-service auth-service product-service search-service gateway; do
            echo "===== $svc"
            tail -n 150 logs/$svc.log || true
          done
          if [ "$OUTBOX_RELAY_ENABLED" = "false" ]; then
            echo "===== connect"
            docker compose -f infra/docker-compose.yml logs --tail 150 connect || true
          fi
          echo "===== alloy"
          docker compose -f infra/docker-compose.yml logs --tail 50 alloy || true
