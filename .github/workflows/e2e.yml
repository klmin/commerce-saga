name: e2e

# 인프라(docker-compose) + 네 서비스(inventory, point, payment, order)를 실제로 띄우고 Saga 스모크 테스트를 돌린다
on:
  push:
    branches: [main]
    paths: ['services/**', 'libs/**', 'build-logic/**', 'infra/**', 'scripts/**', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['services/**', 'libs/**', 'build-logic/**', 'infra/**', 'scripts/**', '.github/workflows/e2e.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: bootJar
        run: ./gradlew :services:order-service:bootJar :services:inventory-service:bootJar :services:point-service:bootJar :services:payment-service:bootJar

      # README 의 기동 명령 그대로. postgres-init(서비스 DB·계정), kafka-init(토픽)까지 끝나야 성공한다
      - name: 인프라 기동
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180

      - name: 서비스 기동
        run: |
          mkdir -p logs
          for svc in inventory-service point-service payment-service order-service; do
            nohup java -jar services/$svc/build/libs/$svc-*.jar > logs/$svc.log 2>&1 &
          done
          for port in 8081 8082 8083 8084; do
            url=http://localhost:$port/actuator/health
            for i in $(seq 1 60); do
              curl -sf "$url" | grep -q UP && break
              sleep 2
            done
            curl -sf "$url" | grep -q UP || { echo "$url not UP"; exit 1; }
          done

      - name: 스모크 테스트
        run: bash scripts/smoke-saga.sh

      - name: Logs
        if: always()
        run: |
          for svc in inventory-service point-service payment-service order-service; do
            echo "===== $svc"
            tail -n 150 logs/$svc.log || true
          done
