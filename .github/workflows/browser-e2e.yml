name: browser-e2e

# 브라우저 e2e (Playwright, frontend/e2e). 인프라 + 서비스 7개 + Next(production 빌드)를 띄우고 화면으로 시나리오를 돈다:
# 로그인·가입, 주문 Saga(정상·품절·포인트 부족 보상·중복 제출·남의 주문), 포인트·결제 내역·알림, 로그인 기기 관리, 관리자 결제 장애 주입.
# e2e(saga) 워크플로와 따로 둔다: 그쪽은 시나리오 9 를 위해 Gateway 사용자 rate limit 을 낮춰 띄우는데, 화면은 한 번에
# API 를 여러 개 불러 그 값으로는 429 가 섞인다. relay 는 스케줄러 모드 하나(두 모드 차이는 e2e 워크플로가 본다)
on:
  push:
    branches: [main]
    paths: ['frontend/**', 'services/**', 'libs/**', 'build-logic/**', 'infra/**', '.github/workflows/browser-e2e.yml']
  pull_request:
    paths: ['frontend/**', 'services/**', 'libs/**', 'build-logic/**', 'infra/**', '.github/workflows/browser-e2e.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: bootJar
        run: ./gradlew :services:order-service:bootJar :services:inventory-service:bootJar :services:point-service:bootJar :services:payment-service:bootJar :services:notification-service:bootJar :services:auth-service:bootJar :services:gateway:bootJar

      - name: Next 빌드, Playwright 브라우저
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: 인프라 기동
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180

      - name: 서비스·Next 기동
        run: |
          mkdir -p logs
          for svc in auth-service inventory-service point-service payment-service order-service notification-service gateway; do
            nohup java -jar services/$svc/build/libs/$svc-*.jar > logs/$svc.log 2>&1 &
          done
          # 3000 은 Grafana. Next 서버만 Gateway(:8000)를 부른다 (ADR 0011)
          (cd frontend && BACKEND_URL=http://localhost:8000 nohup npm run start -- --port 3001 > ../logs/frontend.log 2>&1 &)
          for url in 8086 8081 8082 8083 8084 8085 8000; do
            url=http://localhost:$url/actuator/health
            for i in $(seq 1 60); do curl -sf "$url" | grep -q UP && break; sleep 2; done
            curl -sf "$url" | grep -q UP || { echo "$url not UP"; exit 1; }
          done
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3001/login && break; sleep 1; done
          curl -sf -o /dev/null http://localhost:3001/login

      - name: Playwright
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3001
        run: npx playwright test

      - name: Playwright 결과 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

      - name: Logs
        if: always()
        run: |
          for f in logs/*.log; do
            echo "===== $f"
            tail -n 100 "$f" || true
          done
