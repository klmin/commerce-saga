name: release

# 후속 3 K-4: main 에 머지되면 이미지 9개(서비스 7 + frontend + connect)를 GHCR 에 올리고,
# 다 올라가면 release/eks 브랜치를 그 커밋으로 옮긴다.
# EKS 의 ArgoCD 는 release/eks 를 보고(deploy/argocd/eks/root.yaml), 그 커밋 해시를 이미지 태그로 쓴다.
# → 이미지가 아직 없는 커밋은 배포되지 않는다. 클러스터 권한은 CI 에 없다(ArgoCD 가 클러스터 안에서 가져간다)
#
# 이미지는 linux/amd64 + linux/arm64 (Graviton 노드·Apple Silicon 에서도 같은 이름으로 받는다).
# 아키텍처마다 그 아키텍처 러너에서 네이티브로 빌드하고(QEMU 에뮬레이션보다 빠르고, npm 네이티브 의존성도 맞다),
# 마지막에 <이름>:<커밋> 하나로 묶는다(멀티 아키텍처 매니페스트). 노드는 자기 CPU 에 맞는 쪽을 받는다.
#
# 롤백: 이미지가 남아 있는 옛 커밋으로 브랜치를 되돌린다
#   git push origin <옛 커밋>:refs/heads/release/eks --force
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write   # release/eks 브랜치 push
  packages: write   # GHCR push

# 머지가 몰려도 한 번에 하나씩, 순서대로 (중간 것은 GitHub 가 건너뛰고 마지막 커밋이 남는다)
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/commerce-saga
  TAG: ${{ github.sha }}
  SERVICES: auth-service product-service order-service inventory-service point-service payment-service notification-service gateway

jobs:
  # 아키텍처별 이미지: <이름>:<커밋>-amd64, <이름>:<커밋>-arm64
  images:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 테스트는 PR 의 CI(backend·e2e·k8s)가 이미 돌렸다. 여기서는 bootJar 만 (jar 는 아키텍처와 무관하지만
      # 잡을 나눠 아티팩트로 넘기는 것보다 각자 빌드하는 편이 단순하다)
      - name: bootJar
        run: ./gradlew $(for s in $SERVICES; do printf ':services:%s:bootJar ' "$s"; done)

      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # source 라벨: GHCR 패키지가 이 저장소에 연결된다
      - name: 이미지 빌드·push (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          label="org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          [ "$(docker version --format '{{.Server.Arch}}')" = "$ARCH" ] || { echo "러너 아키텍처가 $ARCH 가 아님"; exit 1; }
          for s in $SERVICES; do
            docker build -f deploy/docker/service.Dockerfile --label "$label" \
              --build-arg JAR="services/$s/build/libs/$s-0.0.1-SNAPSHOT.jar" -t "$REGISTRY/$s:$TAG-$ARCH" .
          done
          docker build --label "$label" -t "$REGISTRY/frontend:$TAG-$ARCH" frontend
          docker build -f deploy/docker/connect.Dockerfile --label "$label" -t "$REGISTRY/connect:$TAG-$ARCH" deploy/docker
          for s in $SERVICES frontend connect; do
            docker push "$REGISTRY/$s:$TAG-$ARCH"
          done

  # 두 아키텍처를 <이름>:<커밋> 하나로 묶고, 다 묶인 뒤에만 배포 브랜치를 옮긴다
  manifest:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: GHCR 로그인
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: 멀티 아키텍처 매니페스트
        run: |
          set -euo pipefail
          REGISTRY=$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')
          for s in $SERVICES frontend connect; do
            docker buildx imagetools create -t "$REGISTRY/$s:$TAG" "$REGISTRY/$s:$TAG-amd64" "$REGISTRY/$s:$TAG-arm64"
            platforms=$(docker buildx imagetools inspect "$REGISTRY/$s:$TAG" | grep -oE 'Platform: +linux/(amd64|arm64)' | awk '{print $2}' | sort -u | tr '\n' ' ')
            echo "$s: $platforms"
            [ "$platforms" = "linux/amd64 linux/arm64 " ] || { echo "$s 매니페스트에 두 아키텍처가 없음"; exit 1; }
          done

      # GITHUB_TOKEN 의 push 는 다른 워크플로를 띄우지 않는다
      - name: release/eks 를 이 커밋으로
        run: git push --force origin "$TAG:refs/heads/release/eks"
