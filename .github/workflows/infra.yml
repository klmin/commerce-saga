name: infra

# 로컬 인프라(docker-compose)가 실제로 뜨고 토픽·서비스 DB가 만들어지는지 확인한다
on:
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', '.github/workflows/infra.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # README 의 기동 명령 그대로 (kafka-init 포함 전체)
      - name: docker compose up
        run: docker compose -f infra/docker-compose.yml up -d --wait --wait-timeout 180

      - name: 토픽 생성 확인
        run: |
          docker compose -f infra/docker-compose.yml run --rm --no-deps kafka-init
          topics=$(docker compose -f infra/docker-compose.yml exec -T kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list)
          echo "$topics"
          for t in inventory.command inventory.reply point.command point.reply payment.command payment.reply order.events inventory.command.DLT inventory.reply.DLT point.command.DLT point.reply.DLT payment.command.DLT payment.reply.DLT order.events.DLT; do echo "$topics" | grep -qx "$t"; done

      # connect 이미지(apache/kafka + Debezium 플러그인)가 뜨고 Postgres 커넥터를 로드했는지
      - name: Kafka Connect·Debezium 플러그인 확인
        run: |
          plugins=$(curl -sf http://localhost:8088/connector-plugins)
          echo "$plugins"
          echo "$plugins" | grep -q '"class":"io.debezium.connector.postgresql.PostgresConnector"'
          for s in order inventory point payment; do
            r=$(docker compose -f infra/docker-compose.yml exec -T -e PGPASSWORD=postgres postgres psql -U postgres -tAc "select rolreplication from pg_roles where rolname = '${s}_svc'")
            [ "$r" = "t" ] || { echo "${s}_svc 에 replication 권한 없음"; exit 1; }
          done

      - name: 서비스 DB 분리 확인
        run: |
          pg() { docker compose -f infra/docker-compose.yml exec -T -e PGPASSWORD="$2" postgres psql -h localhost -U "$1" -d "$3" -tAc 'select 1'; }
          pg order_svc order_svc order_db
          pg inventory_svc inventory_svc inventory_db
          pg point_svc point_svc point_db
          pg payment_svc payment_svc payment_db
          pg notification_svc notification_svc notification_db
          # 다른 서비스 DB 에는 접속할 수 없어야 한다
          if pg order_svc order_svc inventory_db; then echo "order_svc 가 inventory_db 에 접속됨"; exit 1; fi

      - name: Logs
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs
