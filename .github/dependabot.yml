version: 2
updates:
  # 루트 멀티모듈 + build-logic 의 플러그인 버전
  - package-ecosystem: gradle
    directories: ['/', '/build-logic']
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ['org.springframework*', 'io.spring*']
      others:
        patterns: ['*']
        exclude-patterns: ['org.springframework*', 'io.spring*']

  # frontend (Next·React·도구). PR 이 몰리지 않게 둘로 묶는다: 런타임 의존성 / 개발 도구
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      runtime:
        dependency-type: production
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directories: ['/infra']
    schedule:
      interval: weekly
    ignore:
      # PostgreSQL 메이저는 기존 데이터 볼륨과 호환되지 않아 직접 올린다
      - dependency-name: postgres
        update-types: ['version-update:semver-major']
