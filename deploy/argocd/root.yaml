# ArgoCD app-of-apps 의 뿌리 (후속 3 K-3). 이것 하나만 kubectl apply 하면 나머지는 ArgoCD 가 Git 에서 가져와 맞춘다.
#   kubectl apply -n argocd -f deploy/argocd/root.yaml
# 자식 Application(Strimzi, Envoy Gateway, commerce-saga)은 deploy/argocd/apps 차트가 만든다.
# revision 을 바꾸면 자식도 같은 커밋을 본다 (CI 는 PR 커밋으로 바꿔 넣는다)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-saga-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/klmin/commerce-saga.git
    targetRevision: main
    path: deploy/argocd/apps
    helm:
      parameters:
        - name: revision
          value: main
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
