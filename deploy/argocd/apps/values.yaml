# 자식 Application 이 볼 저장소·커밋. root.yaml 의 helm parameter 로 덮는다
repoURL: https://github.com/klmin/commerce-saga.git
revision: main
# commerce-saga 이미지 태그. 같은 태그로 다시 넣으면 Pod 템플릿이 그대로라 새 이미지로 안 바뀐다 → root 가 빌드마다 새 값을 준다
imageTag: dev

# commerce-saga 가 들어갈 namespace (Strimzi 오퍼레이터도 같은 namespace 의 CR 만 본다)
namespace: commerce

strimzi:
  version: 1.3.1
envoyGateway:
  version: v1.10.0

# commerce-saga 차트에 넘길 값 (deploy/helm/commerce-saga/values.yaml 위에 덮는다)
commerceValues:
  # kind 에는 도메인이 없다 → 경로 방식. CI 는 Envoy 를 localhost:18080 으로 port-forward 해 그 주소로 연다(.github/workflows/k8s.yml)
  edge:
    enabled: true
    mode: path
    path:
      url: http://localhost:18080
