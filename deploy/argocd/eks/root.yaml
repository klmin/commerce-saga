# EKS 용 app-of-apps 뿌리 (후속 3 K-4). 클러스터에 ArgoCD 를 설치한 뒤 이것 하나만 apply 한다 (scripts/eks-argocd.sh).
#   kubectl apply -n argocd -f deploy/argocd/eks/root.yaml
#
# kind·CI 용 deploy/argocd/root.yaml 과 다른 점
# - release/eks 브랜치를 본다. release 워크플로가 GHCR 에 이미지 9개를 다 올린 뒤에만 이 브랜치를 옮긴다
# - 이미지 태그 = ArgoCD 가 지금 sync 하는 커밋 해시($ARGOCD_APP_REVISION). release 워크플로가 같은 해시로 태그를 붙인다
#   → 태그를 Git 에 따로 커밋하지 않아도 "Git 커밋 = 배포된 이미지" 가 된다
# - 자식 Application 도 같은 커밋 해시를 본다(브랜치가 sync 도중 움직여도 매니페스트와 이미지가 어긋나지 않는다)
# - 값은 deploy/argocd/apps/values-eks.yaml (GHCR, LoadBalancer 등)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-saga-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/klmin/commerce-saga.git
    targetRevision: release/eks
    path: deploy/argocd/apps
    helm:
      valueFiles:
        - values-eks.yaml
      parameters:
        - name: revision
          value: $ARGOCD_APP_REVISION
          forceString: true
        - name: imageTag
          value: $ARGOCD_APP_REVISION
          forceString: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
