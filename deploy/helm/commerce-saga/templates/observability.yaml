# 관측성 (ADR 0013, 후속 3 이후 추가). compose(infra/)와 같은 구성을 클러스터 안에 둔다:
#   서비스 ──OTLP(trace·로그)──▶ alloy ──▶ tempo (trace), loki (로그)
#   alloy ──scrape──▶ 서비스 /actuator/prometheus, kafka-exporter (lag·DLT), tempo·loki·prometheus·alloy 자신,
#                     노드 kubelet 의 컨테이너 메모리(k8s 만, kubernetes.alloy) ──remote_write──▶ prometheus (저장·경보 규칙)
#   prometheus ──firing 경보──▶ alertmanager (심각도별 묶기) ──▶ Discord 웹훅 (Secret 이 없으면 null receiver)
#   grafana: Tempo·Loki·Prometheus 데이터 소스(span ↔ 로그 링크)와 대시보드 commerce-saga
# Service 이름이 compose 의 컨테이너 이름과 같아서 설정 파일(files/observability, infra/ 의 사본)을 그대로 쓴다.
# 저장은 emptyDir 이다(Pod 가 바뀌면 사라짐). 로컬·CI 확인용이고 운영이면 오브젝트 스토리지·보존 기간을 정한다
{{- if .Values.observability.enabled }}
{{- $root := . }}
{{- $o := .Values.observability }}
{{- $files := "files/observability" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
data:
  config.alloy: |-
{{ .Files.Get (printf "%s/config.alloy" $files) | indent 4 }}
  kubernetes.alloy: |-
{{ include "commerce.kubernetesAlloy" . | indent 4 }}
---
# kubelet 의 컨테이너 지표(cAdvisor)를 API 서버 프록시로 읽는다 → 노드 조회 권한
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-alloy
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-alloy
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
spec:
  # 한 개. 여러 개면 같은 대상을 겹쳐 긁고 tail sampling 이 trace 를 나눠 받는다 (ADR 0013 "수집기 하나")
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (.Files.Get (printf "%s/config.alloy" $files)) (include "commerce.kubernetesAlloy" .) | sha256sum }}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: {{ $o.alloy.image }}
          # 폴더를 주면 안의 *.alloy 를 한 설정으로 읽는다 (config.alloy 는 compose 와 같은 사본, kubernetes.alloy 는 k8s 만)
          args: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy"]
          env:
            - name: TRACE_SAMPLING_PERCENT
              value: {{ $o.traceSamplingPercent | quote }}
            - name: METRICS_SERVICE_TARGETS
              value: {{ include "commerce.metricsServiceTargets" . | quote }}
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: http, containerPort: 12345 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/alloy }
            - { name: data, mountPath: /var/lib/alloy/data }
          resources: {{- toYaml $o.alloy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels: {{- include "commerce.labels" (dict "name" "alloy" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: http, port: 12345, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  labels: {{- include "commerce.labels" (dict "name" "tempo" "root" $root) | nindent 4 }}
data:
  tempo.yaml: |-
{{ .Files.Get (printf "%s/tempo.yaml" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels: {{- include "commerce.labels" (dict "name" "tempo" "root" $root) | nindent 4 }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "tempo" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get (printf "%s/tempo.yaml" $files) | sha256sum }}
    spec:
      containers:
        - name: tempo
          image: {{ $o.tempo.image }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          {{- with $o.tempo.goMemLimit }}
          env:
            - { name: GOMEMLIMIT, value: {{ . | quote }} }
          {{- end }}
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /tmp/tempo }
          resources: {{- toYaml $o.tempo.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: tempo-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels: {{- include "commerce.labels" (dict "name" "tempo" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - { name: http, port: 3200, targetPort: http }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {{- include "commerce.labels" (dict "name" "loki" "root" $root) | nindent 4 }}
data:
  loki.yaml: |-
{{ .Files.Get (printf "%s/loki.yaml" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: {{- include "commerce.labels" (dict "name" "loki" "root" $root) | nindent 4 }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "loki" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ .Files.Get (printf "%s/loki.yaml" $files) | sha256sum }}
    spec:
      containers:
        - name: loki
          image: {{ $o.loki.image }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /tmp/loki }
          resources: {{- toYaml $o.loki.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: {{- include "commerce.labels" (dict "name" "loki" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: loki
  ports:
    - { name: http, port: 3100, targetPort: http }
---
# compose 의 prometheus.yml 사본. 직접 긁지 않고 alloy 의 remote_write 를 받는다
{{- $promConfig := .Files.Get (printf "%s/prometheus.yml" $files) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels: {{- include "commerce.labels" (dict "name" "prometheus" "root" $root) | nindent 4 }}
data:
  prometheus.yml: |-
{{ $promConfig | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  labels: {{- include "commerce.labels" (dict "name" "prometheus" "root" $root) | nindent 4 }}
data:
  commerce.yml: |-
{{ .Files.Get (printf "%s/commerce.yml" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: {{- include "commerce.labels" (dict "name" "prometheus" "root" $root) | nindent 4 }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "prometheus" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" $promConfig (.Files.Get (printf "%s/commerce.yml" $files)) | sha256sum }}
    spec:
      containers:
        - name: prometheus
          image: {{ $o.prometheus.image }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
            - --web.enable-remote-write-receiver
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
          resources: {{- toYaml $o.prometheus.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: {{- include "commerce.labels" (dict "name" "prometheus" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - { name: http, port: 9090, targetPort: http }
---
# 경보 전달 (ADR 0013 "경보 전달"). prometheus 가 firing 경보를 보내면 심각도별로 묶어 Discord 웹훅으로 보낸다.
# 웹훅 URL 은 차트에 넣지 않고 Secret 으로 받는다(optional). Secret 이 없으면 entrypoint 가 null receiver 로 띄운다
#   kubectl -n commerce create secret generic alertmanager-discord --from-literal=webhook-url='https://discord.com/api/webhooks/…'
#   kubectl -n commerce rollout restart deploy/alertmanager    (URL 은 기동 때 읽는다)
{{- $amConfig := printf "%s%s" (.Files.Get (printf "%s/alertmanager.yml" $files)) (.Files.Get (printf "%s/alertmanager-entrypoint.sh" $files)) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  labels: {{- include "commerce.labels" (dict "name" "alertmanager" "root" $root) | nindent 4 }}
data:
  alertmanager.yml: |-
{{ .Files.Get (printf "%s/alertmanager.yml" $files) | indent 4 }}
  entrypoint.sh: |-
{{ .Files.Get (printf "%s/alertmanager-entrypoint.sh" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: {{- include "commerce.labels" (dict "name" "alertmanager" "root" $root) | nindent 4 }}
spec:
  # 한 개. 여러 개면 gossip 클러스터(--cluster.peer)로 묶어야 같은 경보를 두 번 보내지 않는다
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "alertmanager" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ $amConfig | sha256sum }}
    spec:
      containers:
        - name: alertmanager
          image: {{ $o.alertmanager.image }}
          command: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
          env:
            - { name: DISCORD_WEBHOOK_URL_FILE, value: /etc/alertmanager/secrets/webhook-url }
          ports:
            - { name: http, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml }
            - { name: config, mountPath: /etc/alertmanager/entrypoint.sh, subPath: entrypoint.sh }
            - { name: discord, mountPath: /etc/alertmanager/secrets, readOnly: true }
            - { name: data, mountPath: /alertmanager }
          resources: {{- toYaml $o.alertmanager.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: discord
          secret:
            secretName: {{ $o.alertmanager.discordWebhookSecret.name }}
            items:
              - { key: {{ $o.alertmanager.discordWebhookSecret.key }}, path: webhook-url }
            optional: true
        # 실행 중 상태(침묵·알림 기록)와 entrypoint 가 고른 설정. Pod 가 바뀌면 사라진다
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: {{- include "commerce.labels" (dict "name" "alertmanager" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - { name: http, port: 9093, targetPort: http }
---
# 컨슈머 그룹 lag·DLT 적재 (compose 와 같은 exporter). Kafka 가 뜨기 전에는 재시작하다가 붙는다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
  labels: {{- include "commerce.labels" (dict "name" "kafka-exporter" "root" $root) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-exporter
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "kafka-exporter" "root" $root) | nindent 8 }}
    spec:
      containers:
        - name: kafka-exporter
          image: {{ $o.kafkaExporter.image }}
          args: ["--kafka.server={{ include "commerce.kafkaBootstrap" . }}"]
          ports:
            - { name: http, containerPort: 9308 }
          resources: {{- toYaml $o.kafkaExporter.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter
  labels: {{- include "commerce.labels" (dict "name" "kafka-exporter" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: kafka-exporter
  ports:
    - { name: http, port: 9308, targetPort: http }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels: {{- include "commerce.labels" (dict "name" "grafana" "root" $root) | nindent 4 }}
data:
  datasources.yaml: |-
{{ .Files.Get (printf "%s/datasources.yaml" $files) | indent 4 }}
  dashboards.yaml: |-
{{ .Files.Get (printf "%s/dashboards.yaml" $files) | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  labels: {{- include "commerce.labels" (dict "name" "grafana" "root" $root) | nindent 4 }}
data:
  commerce-saga.json: |-
{{ .Files.Get (printf "%s/commerce-saga.json" $files) | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {{- include "commerce.labels" (dict "name" "grafana" "root" $root) | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "grafana" "root" $root) | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s%s" (.Files.Get (printf "%s/datasources.yaml" $files)) (.Files.Get (printf "%s/dashboards.yaml" $files)) (.Files.Get (printf "%s/commerce-saga.json" $files)) | sha256sum }}
    spec:
      containers:
        - name: grafana
          image: {{ $o.grafana.image }}
          env:
            # 로컬 개발용 익명 관리자 (compose 와 같음). 밖으로는 열지 않는다(edge 는 화면만, port-forward 로 본다)
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
            - { name: GF_AUTH_DISABLE_LOGIN_FORM, value: "true" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
          resources: {{- toYaml $o.grafana.resources | nindent 12 }}
      volumes:
        - name: data
          emptyDir: {}
        - name: provisioning
          configMap: { name: grafana-provisioning }
        - name: dashboards
          configMap: { name: grafana-dashboards }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: {{- include "commerce.labels" (dict "name" "grafana" "root" $root) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - { name: http, port: 3000, targetPort: http }
{{- end }}
