# Postgres 하나에 서비스마다 DB·계정을 나눈다 (compose 와 같은 구성). Debezium(K-2) 을 위해 wal_level=logical.
# 처음 뜰 때 docker-entrypoint-initdb.d 가 files/01-create-service-databases.sql 을 실행한다
# (infra/postgres/init 의 사본. CI 가 두 파일이 같은지 검사한다)
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels: {{- include "commerce.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.superuserPassword | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-postgres-init
  labels: {{- include "commerce.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
data:
  01-create-service-databases.sql: |
{{ .Files.Get "files/01-create-service-databases.sql" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: {{- include "commerce.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: {{- include "commerce.labels" (dict "name" "postgres" "root" .) | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels: {{- include "commerce.labels" (dict "name" "postgres" "root" .) | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          args: ["-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgres
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 3
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ .Release.Name }}-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
