# 백엔드 서비스 8개. 이미지 = deploy/docker/service.Dockerfile, 설정은 application.yml 의 환경변수를 채운다.
# 서비스마다 자기 DB·계정만 받는다 (다른 서비스 DB 비밀번호를 갖지 않는다)
{{- $root := . }}
{{- $kafka := include "commerce.kafkaBootstrap" . }}
{{- /* edge 를 켜면 브라우저가 보는 공개 주소 (설계 문서 7-3·7-4, _helpers.tpl commerce.publicUrls) */}}
{{- $urls := dict }}
{{- if .Values.edge.enabled }}
{{- $urls = include "commerce.publicUrls" . | fromJson }}
{{- end }}
{{- range $name, $svc := .Values.services }}
{{- $jwtKey := and (eq $name "auth-service") $root.Values.authJwtKey.enabled }}
{{- $labels := include "commerce.labels" (dict "name" $name "root" $root) }}
{{- if $svc.db }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-db
  labels: {{- $labels | nindent 4 }}
type: Opaque
stringData:
  # 로컬 개발용 값 (files/01-create-service-databases.sql 의 계정)
  username: {{ printf "%s_svc" $svc.db | quote }}
  password: {{ printf "%s_svc" $svc.db | quote }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- $labels | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- $labels | nindent 4 }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  {{- with $svc.strategy }}
  # 문자열(Recreate)이면 type 만, 맵이면 그대로 (rollingUpdate 포함)
  strategy:
    {{- if kindIs "string" . }}
    type: {{ . }}
    {{- else }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels: {{- $labels | nindent 8 }}
    spec:
      # 롤아웃 중 내려가는 Pod 로 가는 요청이 실패하지 않게 (values gracefulTermination)
      terminationGracePeriodSeconds: {{ $root.Values.gracefulTermination.terminationGracePeriodSeconds }}
      {{- if $jwtKey }}
      # 서명 키 Secret 파일을 앱 사용자(uid 10001, deploy/docker/service.Dockerfile)가 읽게 그룹을 준다
      securityContext:
        fsGroup: 10001
      {{- end }}
      {{- if $svc.db }}
      # Flyway 가 DB 를 못 찾아 재시작을 거듭하지 않게 Postgres 가 받을 때까지 기다린다
      initContainers:
        - name: wait-postgres
          image: {{ $root.Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      {{- end }}
      containers:
        - name: app
          image: {{ include "commerce.image" (dict "name" $name "root" $root) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          # SIGTERM 전에 기다려 Endpoints 에서 빠질 시간을 준다. sleep 핸들러라 이미지에 셸이 없어도 된다 (k8s 1.30+)
          lifecycle:
            preStop:
              sleep: { seconds: {{ $root.Values.gracefulTermination.preStopSleepSeconds }} }
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          env:
            {{- range $k, $v := $root.Values.common.env }}
            {{- if not (and $urls (eq $k "AUTH_ISSUER")) }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            {{- if $urls }}
            # 토큰 iss = 브라우저가 가는 SAS 공개 주소 (edge). 서비스·Gateway 는 이 문자열로 검증한다
            - name: AUTH_ISSUER
              value: {{ $urls.auth | quote }}
            {{- if eq $name "auth-service" }}
            # 고정 클라이언트의 redirect URI·로그아웃 뒤 주소 (시작할 때 DB 에 upsert), 저장된 인가 요청이 없을 때 갈 화면
            - name: WEB_HOME
              value: {{ printf "%s/" $urls.web | quote }}
            - name: WEB_REDIRECT_URI
              value: {{ printf "%s/login/oauth2/code/gateway-web" $urls.web | quote }}
            - name: WEB_POST_LOGOUT_REDIRECT_URIS
              value: {{ $urls.webPostLogout | quote }}
            - name: ADMIN_REDIRECT_URI
              value: {{ printf "%s/login/oauth2/code/gateway-admin" $urls.admin | quote }}
            - name: ADMIN_POST_LOGOUT_REDIRECT_URIS
              value: {{ printf "%s/" $urls.admin | quote }}
            - name: AUTH_COOKIE_SECURE
              value: {{ $urls.secure | quote }}
            {{- end }}
            {{- if eq $name "gateway" }}
            # BFF 로그인: 화면별 클라이언트·돌아올 곳. 경로 방식은 ADMIN_CLIENT_HOST 를 비워 늘 gateway-web (설계 문서 7-4)
            - name: WEB_REDIRECT_URI
              value: {{ printf "%s/login/oauth2/code/gateway-web" $urls.web | quote }}
            - name: ADMIN_REDIRECT_URI
              value: {{ printf "%s/login/oauth2/code/gateway-admin" $urls.admin | quote }}
            - name: ADMIN_CLIENT_HOST
              value: {{ $urls.adminClientHost | quote }}
            - name: WEB_HOME
              value: {{ $urls.webHome | quote }}
            - name: ADMIN_HOME
              value: {{ $urls.adminHome | quote }}
            - name: GATEWAY_COOKIE_SECURE
              value: {{ $urls.secure | quote }}
            {{- end }}
            {{- end }}
            # trace·로그는 클러스터 안 alloy 로 (templates/observability.yaml). 관측성을 끄면 내보내지 않는다(보내면 실패 로그만 쌓인다)
            {{- if $root.Values.observability.enabled }}
            # 파드 이름·노드·네임스페이스는 k8s 가 띄울 때 넣는다 (Downward API). replica 가 여럿이어도 어느 파드의 trace·로그인지 보인다
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            # OTel 표준 resource 속성. Spring Boot 가 읽어 trace·로그에 함께 붙인다. service.name 은 spring.application.name 그대로
            # $(VAR) 는 k8s 가 위에서 정한 환경변수로 바꾼다
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ printf "service.namespace=commerce-saga,service.version=%s,deployment.environment.name=%s,service.instance.id=$(POD_NAME),k8s.pod.name=$(POD_NAME),k8s.node.name=$(NODE_NAME),k8s.namespace.name=$(POD_NAMESPACE)" (include "commerce.imageTag" (dict "name" $name "root" $root)) $root.Values.observability.environment | quote }}
            - name: TRACING_SAMPLING_PROBABILITY
              value: {{ $root.Values.observability.tracingSampling | quote }}
            - name: OTLP_TRACING_ENDPOINT
              value: http://alloy:4318/v1/traces
            - name: OTLP_LOGGING_ENDPOINT
              value: http://alloy:4318/v1/logs
            {{- else }}
            - name: TRACING_SAMPLING_PROBABILITY
              value: "0"
            - name: OTLP_LOGGING_EXPORT_ENABLED
              value: "false"
            {{- end }}
            {{- if $svc.outbox }}
            # Debezium 이 outbox 를 읽으면 스케줄러 relay 를 끈다 (outbox 는 넣고 바로 지운다, ADR 0004)
            - name: OUTBOX_RELAY_ENABLED
              value: {{ (not $root.Values.debezium.enabled) | quote }}
            {{- end }}
            {{- if ne $name "gateway" }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $kafka | quote }}
            {{- end }}
            {{- if ne $name "auth-service" }}
            # SAS 내부 주소 (JWKS·토큰 교환). 공개 주소 AUTH_ISSUER 와 나눈다 (설계 문서 7-3)
            - name: AUTH_INTERNAL_URL
              value: "http://auth-service:{{ (index $root.Values.services "auth-service").port }}"
            {{- end }}
            {{- if or (eq $name "auth-service") (eq $name "gateway") }}
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            {{- end }}
            {{- if eq $name "gateway" }}
            {{- range $target, $t := $root.Values.services }}
            {{- if ne $target "gateway" }}
            - name: {{ $target | replace "-" "_" | upper }}_URL
              value: "http://{{ $target }}:{{ $t.port }}"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if $svc.db }}
            {{- $prefix := upper $svc.db }}
            - name: {{ $prefix }}_DB_URL
              value: "jdbc:postgresql://postgres:5432/{{ $svc.db }}_db"
            - name: {{ $prefix }}_DB_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ $name }}-db, key: username }
            - name: {{ $prefix }}_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $name }}-db, key: password }
            {{- end }}
            {{- if $jwtKey }}
            # 서명 키는 Secret 에서 (values authJwtKey). file: 이 없으면 Spring 이 classpath 로 찾는다
            - name: AUTH_JWT_PRIVATE_KEY_LOCATION
              value: file:/etc/auth-jwt/private.pem
            - name: AUTH_JWT_KEY_ID
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.authJwtKey.secretName }}, key: kid }
            # 로컬 개발용 키 파일(앱이 띄울 때 만들어 재사용)을 끈다. k8s 는 위 Secret 만 쓴다
            - name: AUTH_JWT_DEV_KEY_FILE
              value: ""
            {{- end }}
            {{- if or (eq $name "auth-service") (eq $name "gateway") }}
            # OAuth 클라이언트(Gateway BFF) 시크릿은 Secret 에서 (values oauthClientSecrets, ADR 0017). auth-service 와 Gateway 가 같은 값을 읽는다.
            # 로컬 개발용 파일을 끈다: 시크릿이 없으면 두 앱 모두 기동 실패한다(조용히 만들면 서로 값이 어긋난다)
            {{- range $client := list "gateway-web" "gateway-admin" }}
            - name: {{ $client | replace "-" "_" | upper }}_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.oauthClientSecrets.secretName }}, key: {{ $client }} }
            {{- end }}
            - name: OAUTH_CLIENT_SECRET_DEV_DIR
              value: ""
            {{- end }}
            {{- if $svc.images }}
            # 상품 이미지 저장소 RustFS (ADR 0021). 계정은 Secret (values rustfs.credentialsSecret)
            - name: PRODUCT_IMAGES_ENDPOINT
              value: http://rustfs:9000
            - name: PRODUCT_IMAGES_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.rustfs.credentialsSecret }}, key: access-key }
            - name: PRODUCT_IMAGES_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: {{ $root.Values.rustfs.credentialsSecret }}, key: secret-key }
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources: {{- toYaml $root.Values.serviceResources | nindent 12 }}
          {{- if $jwtKey }}
          volumeMounts:
            - name: auth-jwt-key
              mountPath: /etc/auth-jwt
              readOnly: true
      volumes:
        - name: auth-jwt-key
          secret:
            secretName: {{ $root.Values.authJwtKey.secretName }}
            # 개인키만 파일로. kid 는 env 로 받는다. 0440 + fsGroup 이라 앱 사용자만 읽는다
            defaultMode: 0440
            items:
              - key: private.pem
                path: private.pem
          {{- end }}
{{- end }}
