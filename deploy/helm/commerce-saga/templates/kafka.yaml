# Kafka (Strimzi, KRaft). 노드 하나가 broker·controller 를 겸한다 (kind·CI 용).
# 토픽은 KafkaTopic 으로 명시적으로 만든다 (compose kafka-init 과 같은 목록, 자동 생성 끔)
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: {{ .Release.Name }}
spec:
  replicas: {{ .Values.kafka.replicas }}
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: {{ .Values.kafka.storage }}
        kraftMetadata: shared
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: {{ .Release.Name }}
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: {{ .Values.kafka.replicas }}
      transaction.state.log.replication.factor: {{ .Values.kafka.replicas }}
      transaction.state.log.min.isr: 1
      default.replication.factor: {{ .Values.kafka.replicas }}
      min.insync.replicas: 1
      num.partitions: {{ .Values.kafka.partitions }}
      auto.create.topics.enable: false
      group.initial.rebalance.delay.ms: 0
  entityOperator:
    topicOperator: {}
{{- range $topic := .Values.kafka.topics }}
{{- range $name := list $topic (printf "%s.DLT" $topic) }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  # k8s 이름은 소문자만 된다. 실제 토픽 이름은 topicName
  name: {{ $name | lower }}
  labels:
    strimzi.io/cluster: {{ $.Release.Name }}
spec:
  topicName: {{ $name }}
  partitions: {{ $.Values.kafka.partitions }}
  replicas: {{ $.Values.kafka.replicas }}
{{- end }}
{{- end }}
