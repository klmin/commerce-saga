# commerce-saga 차트 기본값 (후속 3 K-1). 로컬 kind·CI 기준이다. 비밀번호는 모두 로컬 개발용 값.
#
# 먼저 Strimzi 오퍼레이터가 있어야 한다(Kafka·KafkaNodePool·KafkaTopic CRD). deploy/README.md 참고.

image:
  # kind load docker-image 로 넣은 이미지를 쓴다. 레지스트리에 올리면 registry 를 채운다 (예: ghcr.io/klmin)
  registry: ""
  repositoryPrefix: commerce-saga
  tag: dev
  pullPolicy: IfNotPresent

# Postgres·Kafka PVC 의 StorageClass. 비우면 클러스터 기본 (kind 는 standard, EKS 는 EBS CSI 의 gp3 등)
storageClass: ""

# 서비스 공통 환경변수
common:
  env:
    AUTH_JWT_ISSUER: commerce-saga-auth

postgres:
  image: postgres:18-alpine
  # 슈퍼유저. 서비스는 각자 계정으로 자기 DB 에만 붙는다(files/01-create-service-databases.sql)
  superuserPassword: postgres
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:8.4-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

kafka:
  # Strimzi 1.3.1 이 지원하는 마지막 버전. 서비스의 클라이언트(4.4.0)와 호환된다. compose 는 4.4.0
  version: 4.3.2
  replicas: 1
  partitions: 3
  storage: 2Gi
  topics:
    - inventory.command
    - inventory.reply
    - point.command
    - point.reply
    - payment.command
    - payment.reply
    - order.events
    - auth.events

# outbox relay. 배포 기준은 Debezium 이다(ADR 0004): KafkaConnect + 서비스별 KafkaConnector, 서비스는 스케줄러 relay 를 끈다.
# false 면 KafkaConnect 없이 서비스의 스케줄러 relay(OUTBOX_RELAY_ENABLED=true)로 보낸다
debezium:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }
  # 비우면 Strimzi 가 힙을 limit 의 75%(-Xms=-Xmx 약 742Mi)로 잡는다. 힙 밖(메타스페이스·스레드 120여 개·코드 캐시·GC)이
  # 약 300Mi 라 합이 1Gi 를 넘어 OOMKilled 가 반복됐다. 실제 힙 사용은 약 200Mi → 512Mi 로 두고 힙 밖 여유를 남긴다
  jvmOptions:
    "-Xms": 256m
    "-Xmx": 512m

# 백엔드 서비스. 이름 = 이미지 이름 = k8s Service 이름. outbox: 이 서비스 DB 의 outbox 를 Debezium 이 읽는다
services:
  auth-service:
    port: 8086
    db: auth
    outbox: true
    env:
      AUTH_COOKIE_SECURE: "true"
      # 개발용 시드 사용자(user1~4, admin)를 넣는다. 운영이면 classpath:db/migration 만
      AUTH_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-seed
    # 서명 키는 Secret(authJwtKey) 에서 읽어 모든 Pod 가 같다. 그래서 replicas 를 늘려도 된다
    replicas: 1
    # 새 Pod 가 Ready 가 된 뒤 옛 Pod 를 내린다 → 재배포 중에도 auth-service 가 비지 않는다(ServiceDown 경보 없음).
    # 옛·새 Pod 가 같은 키라 함께 응답해도 토큰이 그대로 검증된다. authJwtKey.enabled=false(임시 키)면
    # { type: Recreate, rollingUpdate: null } 로 되돌린다 (임시 키끼리 함께 응답하면 방금 받은 토큰이 다른 Pod 의 JWKS 로 401)
    strategy:
      type: RollingUpdate
      rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  # 상품·가격 (ADR 0016). 메시지·outbox 없음
  product-service:
    port: 8087
    db: product
  order-service:
    port: 8081
    db: order
    outbox: true
    env:
      # 주문 때 상품 가격 확인 (ADR 0016). Gateway 를 거치지 않고 클러스터 안에서
      PRODUCT_SERVICE_URL: http://product-service:8087
  inventory-service:
    port: 8082
    db: inventory
    outbox: true
  point-service:
    port: 8083
    db: point
    outbox: true
  payment-service:
    port: 8084
    db: payment
    outbox: true
  notification-service:
    port: 8085
    db: notification
  gateway:
    port: 8000
    env:
      # Next(BFF) 가 넘기는 X-Forwarded-For 를 믿을 주소. 클러스터 Pod 대역 (ADR 0011)
      GATEWAY_TRUSTED_PROXIES: 10.0.0.0/8,127.0.0.1,::1

# auth-service 서명 키 (ADR 0014 "auth-service 서명 키"). Secret(secretName) 의 private.pem(RSA PKCS#8 PEM)·kid 를 읽는다.
# 앱은 읽기만 한다. 로컬 k8s 는 hook Job(generate, templates/auth-jwt-key.yaml)이 없을 때만 한 번 만들고 그 뒤로는 그대로 둔다.
# Secret 은 차트 매니페스트에 없어 Argo CD 가 관리하지 않는다(일부러). 지우면 다음 sync 때 새 키 → 그 전 access token 무효(refresh 로 복구)
authJwtKey:
  # false 면 Secret 을 쓰지 않고 띄울 때마다 임시 키다(ADR 0008). 그때는 auth-service strategy 를 Recreate 로 (위 주석)
  enabled: true
  # 외부 비밀 저장소(EKS 의 External Secrets 등)가 같은 이름의 Secret 을 채우면 false
  generate: true
  secretName: auth-jwt-key
  # hook Job 이미지. initContainer 가 openssl 로 만들고 본 컨테이너가 kubectl 로 Secret 을 만든다 (둘 다 alpine 기반, sh 포함, amd64·arm64)
  images:
    openssl: alpine/openssl:3.5.8
    kubectl: alpine/kubectl:1.36.1

# 서비스·frontend Pod 를 내릴 때. 종료가 시작되면 Endpoints 에서 빠지는 것과 SIGTERM 이 동시에 일어난다.
# Gateway·kube-proxy·Envoy 가 옛 Pod 주소를 지우기 전에 앱이 연결을 닫으면 그 사이 요청이 실패한다
# (Gateway 는 연결 타임아웃 30초를 기다리다 500). 그래서 SIGTERM 전에 잠깐 기다려 새 요청이 끊기게 한 뒤 닫는다.
# Spring 은 graceful shutdown(기본, 단계당 최대 30초)으로 처리 중인 요청을 끝낸다 → 유예는 대기 + 30초보다 길게
gracefulTermination:
  preStopSleepSeconds: 5
  terminationGracePeriodSeconds: 40

serviceResources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }

frontend:
  enabled: true
  port: 3000
  env:
    COOKIE_SECURE: "true"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# edge (Gateway API). 화면만 밖으로 연다. 구현은 Envoy Gateway (deploy/argocd 가 설치한다)
edge:
  enabled: false
  # 비우면 모든 호스트. 실제 도메인을 쓰면 채운다
  hostname: ""
  # Envoy 의 Service 타입. 클라우드는 LoadBalancer
  serviceType: ClusterIP
  # Envoy Service 의 annotation (클라우드 LB 설정. 예: AWS 는 service.beta.kubernetes.io/aws-load-balancer-scheme)
  serviceAnnotations: {}
  gatewayClass:
    create: true
    name: commerce-edge
    controllerName: gateway.envoyproxy.io/gatewayclass-controller

# 관측성 (ADR 0013): alloy(OTLP 수집기) → tempo·loki, prometheus(+ kafka-exporter, 경보 규칙), grafana.
# 설정 파일은 files/observability (infra/ 의 사본, CI 가 같은지 확인). 끄면 서비스도 trace·로그를 내보내지 않는다.
# 밖으로는 열지 않는다. 보려면 scripts/k8s-port-forward.sh (Grafana http://localhost:3030)
observability:
  enabled: true
  # 서비스 trace 샘플링. 1.0 그대로 둔다: 서비스는 전부 보내고 alloy 가 tail sampling 으로 고른다
  tracingSampling: "1.0"
  # alloy tail sampling: 오류·1초 넘는 trace 는 늘 남기고 actuator trace 는 늘 버린다. 나머지 중 남길 비율(%).
  # 로컬·CI 는 전부. 트래픽이 많은 환경이면 낮춘다 (예: 10)
  traceSamplingPercent: "100"
  # trace·로그의 deployment.environment.name. 같은 Loki·Tempo 에 여러 환경이 섞여도 나눠 볼 수 있게 한다
  environment: local
  alloy:
    image: grafana/alloy:v1.21.3
    # trace·로그에 더해 메트릭 수집(서비스·관측성 스택·노드 컨테이너 지표)까지 한다. 트래픽 없이 ~170Mi,
    # tail sampling 이 trace 를 decision_wait 동안 들고 있어 부하 때 더 쓴다 → 256Mi 는 빠듯해 올린다
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 512Mi }
  tempo:
    image: grafana/tempo:2.10.10
    # 수집보다 검색(Grafana 에서 trace 찾기)이 메모리를 쓴다. 512Mi 는 1시간 범위 검색 한 번에 OOMKilled 됐고(그때 WAL 의
    # 쓰던 블록도 잃는다), 같은 검색에서 Go 힙이 약 700Mi 까지 오른다
    resources:
      requests: { cpu: 50m, memory: 256Mi }
      limits: { memory: 1Gi }
    # Go 런타임 메모리 목표(GOMEMLIMIT). limit 의 약 90% 로 두면 한도에 닿기 전에 GC 가 먼저 돈다. limit 을 바꾸면 같이 바꾼다
    goMemLimit: 900MiB
  loki:
    image: grafana/loki:3.7.9
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  prometheus:
    image: prom/prometheus:v3.15.1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  # 경보 전달(Discord 웹훅). URL 은 비밀값이라 여기 두지 않고 Secret 으로 만든다(deploy/README.md "경보 알림").
  # Secret 이 없으면 null receiver 로 떠서 경보는 Alertmanager UI 에서만 보인다
  alertmanager:
    image: prom/alertmanager:v0.29.0
    discordWebhookSecret:
      name: alertmanager-discord
      key: webhook-url
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  kafkaExporter:
    image: danielqsj/kafka-exporter:v1.11.0
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }
  grafana:
    image: grafana/grafana:13.2.6
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
