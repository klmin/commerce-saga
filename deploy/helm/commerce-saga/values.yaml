# commerce-saga 차트 기본값 (후속 3 K-1). 로컬 kind·CI 기준이다. 비밀번호는 모두 로컬 개발용 값.
#
# 먼저 Strimzi 오퍼레이터가 있어야 한다(Kafka·KafkaNodePool·KafkaTopic CRD). deploy/README.md 참고.

image:
  # kind load docker-image 로 넣은 이미지를 쓴다. 레지스트리에 올리면 registry 를 채운다 (예: ghcr.io/klmin)
  registry: ""
  repositoryPrefix: commerce-saga
  tag: dev
  pullPolicy: IfNotPresent

# Postgres·Kafka PVC 의 StorageClass. 비우면 클러스터 기본 (kind 는 standard, EKS 는 EBS CSI 의 gp3 등)
storageClass: ""

# 서비스 공통 환경변수
common:
  env:
    AUTH_JWT_ISSUER: commerce-saga-auth

postgres:
  image: postgres:18-alpine
  # 슈퍼유저. 서비스는 각자 계정으로 자기 DB 에만 붙는다(files/01-create-service-databases.sql)
  superuserPassword: postgres
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:8.4-alpine
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

kafka:
  # Strimzi 1.3.1 이 지원하는 마지막 버전. 서비스의 클라이언트(4.4.0)와 호환된다. compose 는 4.4.0
  version: 4.3.2
  replicas: 1
  partitions: 3
  storage: 2Gi
  topics:
    - inventory.command
    - inventory.reply
    - point.command
    - point.reply
    - payment.command
    - payment.reply
    - order.events
    - auth.events

# outbox relay. 배포 기준은 Debezium 이다(ADR 0004): KafkaConnect + 서비스별 KafkaConnector, 서비스는 스케줄러 relay 를 끈다.
# false 면 KafkaConnect 없이 서비스의 스케줄러 relay(OUTBOX_RELAY_ENABLED=true)로 보낸다
debezium:
  enabled: true
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 1Gi }

# 백엔드 서비스. 이름 = 이미지 이름 = k8s Service 이름. outbox: 이 서비스 DB 의 outbox 를 Debezium 이 읽는다
services:
  auth-service:
    port: 8086
    db: auth
    outbox: true
    env:
      AUTH_COOKIE_SECURE: "true"
      # 개발용 시드 사용자(user1~4, admin)를 넣는다. 운영이면 classpath:db/migration 만
      AUTH_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/dev-seed
    # 서명 키를 주지 않으면 띄울 때마다 새 임시 키다(ADR 0008). 인스턴스 여럿이면 키를 Secret 으로 넣어야 한다
    replicas: 1
    # 옛 Pod 와 새 Pod 가 서로 다른 임시 키로 함께 응답하지 않게, 옛 Pod 를 먼저 내린다 (RollingUpdate 면 방금 받은 토큰이 다른 Pod 의 JWKS 로 401)
    strategy: Recreate
  order-service:
    port: 8081
    db: order
    outbox: true
  inventory-service:
    port: 8082
    db: inventory
    outbox: true
  point-service:
    port: 8083
    db: point
    outbox: true
  payment-service:
    port: 8084
    db: payment
    outbox: true
  notification-service:
    port: 8085
    db: notification
  gateway:
    port: 8000
    env:
      # Next(BFF) 가 넘기는 X-Forwarded-For 를 믿을 주소. 클러스터 Pod 대역 (ADR 0011)
      GATEWAY_TRUSTED_PROXIES: 10.0.0.0/8,127.0.0.1,::1

serviceResources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }

frontend:
  enabled: true
  port: 3000
  env:
    COOKIE_SECURE: "true"
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }

# edge (Gateway API). 화면만 밖으로 연다. 구현은 Envoy Gateway (deploy/argocd 가 설치한다)
edge:
  enabled: false
  # 비우면 모든 호스트. 실제 도메인을 쓰면 채운다
  hostname: ""
  # Envoy 의 Service 타입. 클라우드는 LoadBalancer
  serviceType: ClusterIP
  # Envoy Service 의 annotation (클라우드 LB 설정. 예: AWS 는 service.beta.kubernetes.io/aws-load-balancer-scheme)
  serviceAnnotations: {}
  gatewayClass:
    create: true
    name: commerce-edge
    controllerName: gateway.envoyproxy.io/gatewayclass-controller

# 관측성 (ADR 0013): alloy(OTLP 수집기) → tempo·loki, prometheus(+ kafka-exporter, 경보 규칙), grafana.
# 설정 파일은 files/observability (infra/ 의 사본, CI 가 같은지 확인). 끄면 서비스도 trace·로그를 내보내지 않는다.
# 밖으로는 열지 않는다. 보려면 scripts/k8s-port-forward.sh (Grafana http://localhost:3030)
observability:
  enabled: true
  # 서비스 trace 샘플링. 1.0 그대로 둔다: 서비스는 전부 보내고 alloy 가 tail sampling 으로 고른다
  tracingSampling: "1.0"
  # alloy tail sampling: 오류·1초 넘는 trace 는 늘 남기고 actuator trace 는 늘 버린다. 나머지 중 남길 비율(%).
  # 로컬·CI 는 전부. 트래픽이 많은 환경이면 낮춘다 (예: 10)
  traceSamplingPercent: "100"
  # trace·로그의 deployment.environment.name. 같은 Loki·Tempo 에 여러 환경이 섞여도 나눠 볼 수 있게 한다
  environment: local
  alloy:
    image: grafana/alloy:v1.21.3
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 256Mi }
  tempo:
    image: grafana/tempo:2.10.10
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  loki:
    image: grafana/loki:3.7.9
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  prometheus:
    image: prom/prometheus:v3.15.1
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
  kafkaExporter:
    image: danielqsj/kafka-exporter:v1.11.0
    resources:
      requests: { cpu: 20m, memory: 32Mi }
      limits: { memory: 128Mi }
  grafana:
    image: grafana/grafana:13.2.6
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }
