# 로컬·CI 용 Prometheus. 메트릭 저장·조회와 경보 규칙만 맡는다 (ADR 0013)
# 직접 긁지 않는다. Alloy 가 서비스·kafka-exporter·관측성 스택을 긁어 remote_write 로 넣는다(--web.enable-remote-write-receiver).
# 그래서 /targets 화면은 비어 있다. 수집 대상 상태는 up{job="..."} 또는 Alloy UI(http://localhost:12346)로 본다
global:
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

# firing 경보를 Alertmanager 로 보낸다. 묶기·심각도별 라우팅·Discord 전달은 그쪽(infra/alertmanager/alertmanager.yml)
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
