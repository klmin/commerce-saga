# 경보 규칙 (ADR 0013). 문턱값은 로컬·CI 시나리오(단계 타임아웃 10초)에서 바로 보이도록 짧게 잡았다.
# 운영 값은 ADR 0013 표를 따른다 (예: 결제 UNKNOWN 30s → 5m)
groups:
  - name: commerce-saga
    rules:
      - alert: ServiceDown
        expr: up{job="services"} == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} 가 응답하지 않음"
          description: "메시지는 Kafka 에 쌓였다가 복구 후 처리된다. 오래가면 Saga 가 재전송을 포기하고 보상한다 (시나리오 4)"

      - alert: SagaStuck
        expr: max by (state) (commerce_saga_oldest_active_age_seconds{phase="forward"}) > 60
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.state }} 단계 Saga 가 {{ $value | humanizeDuration }} 째 끝나지 않음"
          description: "정상 주문은 몇 초 안에 끝난다. 참여 서비스 장애·relay 중단을 의심. Tempo 에서 주문 id 로 trace 검색"

      - alert: SagaCompensationStuck
        expr: max by (state) (commerce_saga_oldest_active_age_seconds{phase="compensating"}) > 120
        labels: {severity: critical}
        annotations:
          summary: "보상 단계 {{ $labels.state }} 가 {{ $value | humanizeDuration }} 째 끝나지 않음"
          description: "보상은 포기하지 않고 계속 재전송한다. 재고·포인트가 묶여 있으므로 사람이 봐야 한다"

      - alert: SagaTimeoutGiveUp
        expr: increase(commerce_saga_timeout_give_ups_total[5m]) > 0
        labels: {severity: warning}
        annotations:
          summary: "최근 5분 동안 재전송을 포기하고 보상한 Saga {{ $value | humanize }}건"
          description: "참여 서비스가 오래 응답하지 않아 주문이 취소됐다 (ADR 0007)"

      - alert: PaymentResultUnknown
        expr: commerce_payment_oldest_unknown_age_seconds > 30
        labels: {severity: warning}
        annotations:
          summary: "PG 결과를 모르는 결제가 {{ $value | humanizeDuration }} 째 남아 있음"
          description: "PG 조회로 확정되지 않고 있다. PG 장애·지연을 의심 (시나리오 2)"

      - alert: PaymentRefundPending
        expr: commerce_payment_oldest_refund_pending_age_seconds > 60
        labels: {severity: critical}
        annotations:
          summary: "취소된 주문의 승인 결제 환불이 {{ $value | humanizeDuration }} 째 안 됨"
          description: "고객 돈이 나간 채로 주문은 취소된 상태. PG 환불 실패 로그 확인"

      - alert: DeadLetterMessage
        expr: sum by (topic) (increase(kafka_topic_partition_current_offset{topic=~".+[.]DLT"}[5m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.topic }} 에 처리하지 못한 메시지가 들어옴"
          description: "원인 확인 후 scripts/dlt.sh replay 로 재처리 (ADR 0012, 시나리오 6)"

      - alert: ConsumerLagHigh
        # kafka_consumergroup_lag 는 한 번도 커밋하지 않은 파티션을 -1 로 내보내 합이 실제보다 작아진다. 그 파티션을 뺀 _sum 을 쓴다
        expr: sum by (consumergroup, topic) (kafka_consumergroup_lag_sum) > 20
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.consumergroup }} 가 {{ $labels.topic }} 에서 {{ $value }}건 밀림"
          description: "컨슈머가 죽었거나 느리거나, 분류되지 않은 영구 오류로 파티션이 막혔다 (제자리 재시도)"

      - alert: OutboxBacklog
        expr: max by (service) (commerce_outbox_oldest_pending_age_seconds) > 30
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.service }} outbox 가 {{ $value | humanizeDuration }} 째 발행되지 않음"
          description: "스케줄러 relay 가 Kafka 에 보내지 못하고 있다 (Debezium 모드는 항상 0)"

      - alert: ReplicationSlotLag
        expr: max by (service) (commerce_outbox_replication_slot_lag_bytes) > 100 * 1024 * 1024
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} DB 의 replication slot 이 WAL {{ $value | humanize1024 }}B 를 붙잡고 있음"
          description: "Debezium 커넥터가 멈췄거나 막혔다. 디스크가 찰 수 있다 (ADR 0004, 시나리오 5)"

  # 관측성 스택 자신. 여기가 멈추면 위 경보도 trace·로그도 조용히 사라진다
  - name: observability
    rules:
      # 메트릭은 Alloy 가 긁어 보낸다. Alloy 가 멈추면 up 자체가 안 들어와 ServiceDown 도 울리지 않으므로 '사라짐'을 본다
      - alert: MetricsPipelineDown
        expr: absent_over_time(up{job="alloy"}[1m])
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "Alloy 에서 메트릭이 1분 넘게 들어오지 않음"
          description: "수집기가 멈췄거나 Prometheus 로 보내지 못한다. 그동안 다른 경보는 판단할 데이터가 없다. trace·로그도 같은 수집기를 지난다"

      - alert: ObservabilityTargetDown
        expr: up{job=~"tempo|loki|alertmanager"} == 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.job }} 가 응답하지 않음"
          description: "trace(tempo)·로그(loki) 저장소가 죽어 있으면 그동안 들어온 것은 버려진다. alertmanager 가 죽어 있으면 경보가 Discord 로 가지 않는다(Prometheus /alerts 에서만 보인다)"

      # k8s 에서만 값이 있다(노드 kubelet 의 컨테이너 지표, 차트의 kubernetes.alloy). limit 에 닿으면 커널이 죽인다(OOMKilled)
      - alert: ContainerMemoryNearLimit
        expr: |
          max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
            / max by (namespace, pod, container) (container_spec_memory_limit_bytes{container!=""} > 0) > 0.9
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.pod }}/{{ $labels.container }} 메모리가 limit 의 {{ $value | humanizePercentage }}"
          description: "곧 OOMKilled 로 재시작될 수 있다. JVM 이면 힙(-Xmx)과 힙 밖을 합친 값이 limit 안에 드는지 본다"
