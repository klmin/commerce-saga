# 로컬 개발용 인프라. 서비스(Spring Boot 앱)는 호스트에서 ./gradlew bootRun 으로 띄운다.
#
#   docker compose -f infra/docker-compose.yml up -d --wait
#
# - PostgreSQL : localhost:5432  (wal_level=logical, 서비스별 DB·계정은 postgres/init 참고)
# - Kafka      : localhost:9092  (KRaft 단일 노드, 컨테이너끼리는 kafka:29092)
# - Kafka UI   : http://localhost:8989
# - Kafka Connect (Debezium) REST : http://localhost:8088  (커넥터 등록은 scripts/register-connectors.sh)
#   커넥터를 등록하지 않으면 아무것도 발행하지 않는다. relay 모드는 docs/PROGRESS.md 7절 참고
# - Alloy      : OTLP http://localhost:4328 (서비스 trace·로그 수신 → Tempo·Loki), UI http://localhost:12346
# - Tempo      : API http://localhost:3210 (trace 저장)
# - Loki       : API http://localhost:3110 (로그 저장)
# - Grafana    : http://localhost:3030 (trace·로그·대시보드, 익명 접근)
# - Prometheus : http://localhost:9091 (메트릭, 경보 규칙)
# - Redis      : localhost:6380 (auth-service 의 refresh token·로그인 실패 횟수. 6379 는 흔히 다른 Redis 가 써서 피함)
# 포트는 infra/.env 로 바꿀 수 있다 (.env.example 참고). 계정·비밀번호는 로컬 개발용 값이다.
name: commerce-saga

services:
  postgres:
    image: postgres:18-alpine
    # Debezium(3단계)이 WAL 을 읽을 수 있게 logical 로 둔다
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=10", "-c", "max_wal_senders=10"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # auth-service 의 refresh token family·로그인 실패 횟수 (ADR 0008). 잃어도 다시 로그인하면 되므로 영속화하지 않는다
  redis:
    image: redis:8.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # 서비스별 DB·계정 생성 후 종료한다. up 할 때마다 실행되고 멱등이라 서비스가 늘면 기존 볼륨에도 추가된다
  postgres-init:
    image: postgres:18-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./postgres/init:/init:ro
    command: ["psql", "-h", "postgres", "-U", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/init/01-create-service-databases.sql"]
    restart: "no"

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      # 토픽은 kafka-init 이 명시적으로 만든다 (오타난 토픽이 조용히 생기지 않게)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 3s
      timeout: 10s
      retries: 30

  # 토픽 생성 후 종료한다. 메시지 키가 orderId 라 파티션 수 = 주문 처리 병렬도
  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # <토픽>.DLT: 재시도해도 처리할 수 없는 원본 메시지 보관 (리스너 에러 핸들러가 옮긴다)
        # auth.events: 키가 userId (가입 → 포인트 계정, 후속 2 A-3-2)
        for t in inventory.command inventory.reply point.command point.reply payment.command payment.reply order.events auth.events inventory.command.DLT inventory.reply.DLT point.command.DLT point.reply.DLT payment.command.DLT payment.reply.DLT order.events.DLT auth.events.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
        # Debezium 커넥터 heartbeat (heartbeat.interval.ms). 트래픽이 없는 DB 의 slot 위치를 앞으로 옮긴다 (시나리오 5)
        for c in order-outbox inventory-outbox point-outbox payment-outbox auth-outbox; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "__debezium-heartbeat.$$c" --partitions 1 --replication-factor 1
        done
    restart: "no"

  # Debezium outbox relay. 브로커와 같은 apache/kafka 이미지 위에 Debezium Postgres 플러그인을 얹는다 (connect/Dockerfile)
  # 서비스마다 커넥터 하나(connect/<서비스>-outbox.json)가 자기 DB 의 outbox 를 읽어 aggregatetype 토픽으로 보낸다
  connect:
    build: ./connect
    image: commerce-saga/connect:local
    depends_on:
      kafka:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      # 커넥터 설정의 ${env:...} 가 읽는 DB 비밀번호 (로컬 개발용 값, postgres/init 과 같음)
      ORDER_DB_PASSWORD: order_svc
      INVENTORY_DB_PASSWORD: inventory_svc
      POINT_DB_PASSWORD: point_svc
      PAYMENT_DB_PASSWORD: payment_svc
      AUTH_DB_PASSWORD: auth_svc
    ports:
      # 8083 은 point-service 가 쓰므로 호스트에는 8088 로 연다
      - "${CONNECT_PORT:-8088}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8083/connector-plugins"]
      interval: 3s
      timeout: 5s
      retries: 60

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "${KAFKA_UI_PORT:-8989}:8080"
    # 일회성 init 컨테이너들의 완료를 기다린다. 이렇게 의존해 두면 `up --wait` 가 그 종료(exit 0)를
    # 실패로 보지 않고, init 이 실패하면 up 도 실패한다 (kafka-ui 가 마지막에 뜨는 서비스 역할)
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres-init:
        condition: service_completed_successfully

  # 수집기 (ADR 0013). 서비스가 trace·로그를 여기로 보내고 (OTLP_TRACING_ENDPOINT·OTLP_LOGGING_ENDPOINT,
  # 기본 http://localhost:4328/v1/traces·/v1/logs) → trace 는 tempo, 로그는 loki.
  # 메트릭도 여기서 긁는다: 호스트에서 뜬 서비스 /actuator/prometheus, kafka-exporter, 관측성 스택 → prometheus 로 remote_write
  # 호스트 포트는 다른 관측성 스택과 겹치지 않게 표준(4318·12345)에서 비켜 둔다
  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      # tail sampling: 오류·느린 trace 를 뺀 나머지 중 남길 비율(%). actuator trace 는 늘 버린다
      TRACE_SAMPLING_PERCENT: ${TRACE_SAMPLING_PERCENT:-100}
      # 메트릭을 긁을 서비스 8개. 서비스는 호스트에서 뜨므로 host.docker.internal (리눅스 CI 는 아래 extra_hosts 의 host-gateway)
      METRICS_SERVICE_TARGETS: >-
        [{"__address__":"host.docker.internal:8081","service":"order-service"},
        {"__address__":"host.docker.internal:8082","service":"inventory-service"},
        {"__address__":"host.docker.internal:8083","service":"point-service"},
        {"__address__":"host.docker.internal:8084","service":"payment-service"},
        {"__address__":"host.docker.internal:8085","service":"notification-service"},
        {"__address__":"host.docker.internal:8086","service":"auth-service"},
        {"__address__":"host.docker.internal:8087","service":"product-service"},
        {"__address__":"host.docker.internal:8000","service":"gateway"}]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${OTLP_HTTP_PORT:-4328}:4318"
      - "${ALLOY_PORT:-12346}:12345"
    depends_on:
      - tempo
      - loki
      - prometheus
    # 이미지에 wget·curl 이 없어 healthcheck 를 두지 않는다. 준비 여부는 호스트에서 http://localhost:12346/-/ready

  # 분산 트레이싱 저장소 (ADR 0013). alloy 가 OTLP 로 넣는다. 호스트 포트는 조회 API 만 (표준 3200 에서 비킴)
  tempo:
    image: grafana/tempo:2.10.10
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "${TEMPO_PORT:-3210}:3200"
    # 이미지에 셸·wget 이 없어 healthcheck 를 두지 않는다. 준비 여부는 호스트에서 http://localhost:3210/ready

  # 로그 저장소 (ADR 0013). alloy 가 OTLP 로 넣고 Grafana 에서 trace ↔ 로그를 오간다. 호스트 포트는 표준 3100 에서 비킴
  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "${LOKI_PORT:-3110}:3100"
    # 이미지에 셸이 없어 healthcheck 를 두지 않는다. 준비 여부는 호스트에서 http://localhost:3110/ready

  # 메트릭 저장·경보 (ADR 0013). 직접 긁지 않고 alloy 가 보내는(remote_write) 메트릭을 받아 경보 규칙(prometheus/rules)을 평가한다
  # 호스트 포트는 다른 Prometheus 와 겹치지 않게 9091
  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/ready"]
      interval: 3s
      timeout: 5s
      retries: 30

  # 경보 전달 (ADR 0013 "경보 전달"). prometheus 가 firing 경보를 보내면 심각도별로 묶어 Discord 웹훅으로 보낸다
  # 웹훅 URL 은 비밀값이라 저장소에 넣지 않는다: DISCORD_WEBHOOK_URL 을 셸에서 export 하거나 infra/.env(gitignore)에 둔다.
  # 없으면 null receiver 로 뜬다(경보는 http://localhost:9095 UI·API 에서만). 호스트 포트는 표준 9093 에서 비킴
  alertmanager:
    image: prom/alertmanager:v0.35.0
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
    ports:
      - "${ALERTMANAGER_PORT:-9095}:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9093/-/ready"]
      interval: 3s
      timeout: 5s
      retries: 30

  # 컨슈머 그룹 lag·토픽 오프셋 (서비스가 죽어 있어도 브로커 기준으로 보인다)
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:29092"]
    depends_on:
      kafka:
        condition: service_healthy

  # trace(Explore → Tempo)·로그(Explore → Loki, trace 와 서로 링크), 메트릭·경보(대시보드 "commerce-saga", Alerting). 로컬 개발용 익명 관리자
  grafana:
    image: grafana/grafana:13.2.6
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    depends_on:
      - tempo
      - loki

volumes:
  postgres-data:
  kafka-data:
