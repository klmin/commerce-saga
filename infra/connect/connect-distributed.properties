# Kafka Connect 워커 설정 (로컬 단일 워커). 커넥터 설정은 같은 폴더의 *-outbox.json, 등록은 scripts/register-connectors.sh
bootstrap.servers=kafka:29092
group.id=commerce-connect
plugin.path=/opt/kafka/plugins

# 커넥터·오프셋·상태 저장 토픽. 브로커의 토픽 자동 생성은 꺼져 있지만 Connect 가 직접 만든다 (단일 브로커라 복제 1)
config.storage.topic=_connect-configs
offset.storage.topic=_connect-offsets
status.storage.topic=_connect-status
config.storage.replication.factor=1
offset.storage.replication.factor=1
status.storage.replication.factor=1

# 기본 변환기. 커넥터 JSON 에서 다시 명시한다
key.converter=org.apache.kafka.connect.storage.StringConverter
value.converter=org.apache.kafka.connect.json.JsonConverter
value.converter.schemas.enable=false
# 헤더(id, type)를 따옴표 없는 문자열 그대로 쓴다. JsonConverter 로 두면 "\"...\"" 처럼 JSON 문자열이 된다
header.converter=org.apache.kafka.connect.storage.SimpleHeaderConverter

listeners=http://0.0.0.0:8083
rest.advertised.host.name=connect

# 커넥터 설정의 DB 비밀번호는 ${env:...} 로 컨테이너 환경 변수에서 읽는다 (JSON·등록 요청에 값이 남지 않게)
config.providers=env
config.providers.env.class=org.apache.kafka.common.config.provider.EnvVarConfigProvider

# Connect 프로듀서: acks=all + 멱등 (재시도해도 같은 파티션 안 순서 유지. Kafka 기본값이지만 명시)
producer.acks=all
producer.enable.idempotence=true
offset.flush.interval.ms=1000
